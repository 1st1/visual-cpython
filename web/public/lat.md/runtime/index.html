ory returns to the live frontier. After completion, history can be replayed; Run at the end starts a fresh interpreter. Edited source must be compiled again. Changing examples, recompiling, or closing changed source terminates execution and clears the preceding session. No trace persists between runs."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":97,"data-source-end-line":97},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/index.html/"},"children":[{"type":"text","value":"web/index.html"}]},{"type":"text","value":" keeps Compile in the top-left toolbar and execution controls at top right. Run/Pause remains available during execution. The first control is Reset with a stop icon: it discards the interpreter, history, and output while preserving compiled artifacts and scene geometry, without a message. Reset is always visible, becomes enabled only after Pause, and disables after reset or resume. Recompiling or changing the program also discards the worker. Starting Run does not flash a loading label or capture progress track. The slider shows retained history rather than predicted completion. Errors remain visible; ordinary completion status stays hidden. The Emscripten linear-memory cap remains 256 MiB, excluding browser overhead and user-visible history."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"validation","data-source-start-line":99,"data-source-end-line":99},"children":[{"type":"text","value":"Validation"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":101,"data-source-end-line":101},"children":[{"type":"text","value":"Native semantic tests check observed values and identity, not merely event presence. The WASM smoke runner exercises the same packaged runtime used by the browser."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start

m that CPython runs a network of autonomous machines. It develops the stable layout in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/postgres-reference#postgresql-visual-reference","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"postgres-reference#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"PostgreSQL visual reference"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"4 references"},"children":[{"type":"text","value":"4"}]}]},{"type":"text","value":" and the execution semantics in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/execution#interpreter-and-jit-execution","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"execution#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Interpreter and JIT execution"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"4 references"},"children":[{"type":"text","value":"4"}]}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"The first implementation is interpreter-only. JIT structures below describe a deferred extension; omit them from the initial map and controls. Placement and connection routing are developed in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout#block-placement-and-connection-routing","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"layout#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Block placement and connection routing"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"6 references"},"children":[{"type":"text","value":"6"}]}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"the-starting-map","data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"The starting map"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"text","value":"Before code runs, the map contains recognizable infrastructure and an empty program plot. The viewer can distinguish machinery that exists independently of the program from structures created for this run."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"Place the source terminal and tokenizer/parser near the plot's entrance, followed by scope analysis, code generation, and assembly. Put the evaluator, frame area, and object/environment storage near the program plot. Reserve a connected area for recording, optimization, and executors in JIT mode. These are visual roles; operations such as parsing are not separate operating-system processes."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"text","value":"Use a tiled ground plane, modular structures, routed connections, and local indicators as the visual vocabulary. Use restrained accents on active elements, with sufficient solid surfaces and contrast to make the map readable. Exact art, scale, and camera styling remain open; the conceptual influence does not require reproducing game assets or interface chrome."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"compilation-constructs-the-program-neighborhood","data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"Compilation constructs the program neighborhood"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"New program structures appear as the corresponding artifacts become available. A staged reveal explains compilation without falsely suggesting that successful parsing has already created executable instructions."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"text","value":"First reveal syntax as a blueprint: function boundaries, statements, branches, and loops appear in a source-linked AST view. Scope analysis annotates names and their relationships. Code generation and CFG construction then establish executable basic blocks and control-flow edges. Assembly completes the code-object structure and its metadata. See "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/compilation#shared-compilation-flow","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"compilation#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Shared compilation flow"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":" for the actual dependencies."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"text","value":"Default runtime blocks represent basic blocks inside a code-object enclosure. Each can expand to show its instructions and caches. A function's enclosure is shared by its calls; activation state appears separately. The module has its own enclosure. An AST node is not assumed to map one-to-one to an instruction or a basic block."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"text","value":"Use a preview layout to reserve positions before revealing structures. Blueprint geometry is an explanatory preview, not an artifact claimed to exist inside CPython. Keep source-to-AST-to-instruction mappings inspectable as representations change. A compilation error leaves the failing artifact highlighted and prevents execution; it should not produce a completed working xray."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"execution-activates-the-neighborhood","data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"text","value":"Execution activates the neighborhood"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"text","value":"The execution cursor follows the program's control-flow routes while nearby machinery exposes the operation's effects. Geometry remains stable as state changes."}]},{"type":"text","value":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"type":"element","tagName":"table","properties":{},"children":[{"type":"element","tagName":"thead","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Program event"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Proposed visible activity"}]}]}]},{"type":"element","tagName":"tbody","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Function definition executes"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"A function object appears and connects to its already compiled code and environment"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":34,"data-source-end-line":34},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Function call"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"An activation appears in the frame area, arguments populate slots, and the cursor enters the callee"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":35,"data-source-end-line":35},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Local load or store"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"The relevant slot and reference route pulse; the operand stack updates"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":36,"data-source-end-line":36},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Arithmetic"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"The active instruction and evaluator light up; operands are consumed and a result becomes available"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":37,"data-source-end-line":37},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Conditional branch"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"The tested condition is shown and the selected outgoing route activates"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":38,"data-source-end-line":38},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Loop iteration"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"The cursor takes the back edge; iteration state changes without adding another copy of the loop"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":39,"data-source-end-line":39},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Return"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"The result passes to the caller and the completed activation retires"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":40,"data-source-end-line":40},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Exception"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"A distinct control route leads to a handler or unwinds activations"}]}]}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":42,"data-source-end-line":42},"children":[{"type":"text","value":"Infrastructure near a selected block can expand into a local detail view of its frame slots, stack, and operands. This is another view of shared state, not a new evaluator or a copied heap. Pin the active frame to the selected function's vicinity when helpful, retaining its parent-frame link."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":44,"data-source-end-line":44},"children":[{"type":"text","value":"Conveyor-like motion means transfer of an artifact, reference, or execution cursor. The visual must distinguish these meanings by lane shape and markers. Loading a variable moves or copies a reference into a slot; it does not physically transport the heap object. In a single-threaded example, idle machines must not animate as though several Python instructions are executing concurrently."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"optimization-visibly-changes-the-routes","data-source-start-line":46,"data-source-end-line":46},"children":[{"type":"text","value":"Optimization visibly changes the routes"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":48,"data-source-end-line":48},"children":[{"type":"text","value":"Adaptive specialization changes an operation site within the existing program. JIT compilation adds a connected execution route for an observed hot path while retaining the original bytecode route."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":50,"data-source-end-line":50},"children":[{"type":"text","value":"In regular mode, a warmed instruction site gains a specialized label and visible cache/guard information. A guard miss shows fallback at that site. This is a change to how the operation executes, not new Python source code."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":52,"data-source-end-line":52},"children":[{"type":"text","value":"In JIT mode, the recorder follows actual execution and accumulates a micro-op strip beside the program. The optimizer produces a second, optimized strip. Native emission builds an executor connected to its real bytecode entry and continuation points. A trace can cross source/basic-block boundaries; it must not be confined to a single source statement by the layout."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":54,"data-source-end-line":54},"children":[{"type":"text","value":"The resulting route may look like a shorter production line, but its length is a visual encoding, not measured speed. Entry guards act as visible gates. A side exit routes execution back to bytecode or another captured executor; invalidation disables the affected executor. Keep the original path visible so the viewer understands the relationship. The build-time stencil preparation stays in its own inset rather than operating on every run."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":56,"data-source-end-line":56},"children":[{"type":"text","value":"The rendering should accept either captured native events or browser-generated interpreter events. A WASM interpreter does not establish native-JIT support; the native executor chapter must retain explicit capture provenance and the backend distinction in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/cpython#comparison-boundary","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"cpython#CPython visualization plan#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Comparison boundary"}]}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"stable-layout-and-controlled-detail","data-source-start-line":58,"data-source-end-line":58},"children":[{"type":"text","value":"Stable layout and controlled detail"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":60,"data-source-end-line":60},"children":[{"type":"text","value":"Use a deterministic grid layout with reserved space and routed edges. Execution should change highlights and contents, not continuously rearrange the world."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":62,"data-source-end-line":62},"children":[{"type":"text","value":"Group by code object, lay out basic blocks with a consistent forward direction, and route loop-back edges along the enclosure perimeter. Use separate ports and line styles for control flow, references, and compilation dependencies. Aggregate inactive reference links and expose them on selection to prevent a dense web of wires."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":64,"data-source-end-line":64},"children":[{"type":"text","value":"Reserve space beside code objects for frame inspection and JIT traces. Additional calls reuse the code enclosure; recursion adds activation entries, not duplicated function factories. Collapse deeper stacks and large collections with explicit counts. Semantic zoom moves from function/code-object overview to basic blocks to instructions and individual slots."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":66,"data-source-end-line":66},"children":[{"type":"text","value":"For program edits, start a new compilation/run and preserve positions for reliably matched unchanged structures when possible. Within a run, IDs and positions remain stable. Do not imply that arbitrary live code edits patch an executing frame. Layout must tolerate a small source program producing many runtime objects or events; the source-size limit does not bound the map."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"first-storyboard-and-acceptance-criteria","data-source-start-line":68,"data-source-end-line":68},"children":[{"type":"text","value":"First storyboard and acceptance criteria"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":70,"data-source-end-line":70},"children":[{"type":"text","value":"The first design exercise follows the accumulator example through construction, one cold execution, and repeated adaptive-interpreter execution. It uses the same map throughout; JIT execution is deferred."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"ol","properties":{},"children":[{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":72,"data-source-end-line":72},"children":[{"type":"text","value":"Show the dormant infrastructure, source terminal, and empty plot."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":73,"data-source-end-line":73},"children":[{"type":"text","value":"Parse the source into an inspectable blueprint, then reveal compiled blocks and their connections."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":74,"data-source-end-line":74},"children":[{"type":"text","value":"Execute the module definition and call; show the function object and its first activation separately."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":75,"data-source-end-line":75},"children":[{"type":"text","value":"Step one addition and loop-back edge, showing local slots and the operand stack."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":76,"data-source-end-line":76},"children":[{"type":"text","value":"Replay warm execution with specialization visible at the affected instruction sites."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"li","properties":{"data-source-start-line":77,"data-source-end-line":77},"children":[{"type":"text","value":"Change an input and show a verified interpreter guard-miss or branch transition, with the correct resulting state."}]},{"type":"text","value":"\n"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":79,"data-source-end-line":79},"children":[{"type":"text","value":"At each pause, the viewer should be able to identify what is executing, which state changed, why a connection lit up, and where execution can go next. Source selection should locate the corresponding map structures, and selecting a block should show its source and actual instructions. Construction animation must be skippable, and stepping must wait for transitions to settle."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":81,"data-source-end-line":81},"children":[{"type":"text","value":"The first implementation should validate this layout and state model with a plain schematic and recorded fixture before adding full 3D art. This preserves "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/presentation#evidence-and-validation-plan","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"presentation#Presentation approach#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Evidence and validation plan"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":" while making the evolving xray map the intended final presentation."}]}]},"title":"Program-built X-Ray world","gitTree":null,"tableOfContents":[{"id":"program-built-x-ray-world","title":"Program-built X-Ray world","depth":1,"errorCount":0,"hasGitChanges":false},{"id":"the-starting-map","title":"The starting map","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"compilation-constructs-the-program-neighborhood","title":"Compilation constructs the program neighborhood","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"execution-activates-the-neighborhood","title":"Execution activates the neighborhoo

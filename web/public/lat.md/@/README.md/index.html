ate"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"pre","properties":{"className":[],"data-source-start-line":62,"data-source-end-line":70},"children":[{"type":"element","tagName":"code","properties":{"className":["language-sh","hljs"]},"children":[{"type":"text","value":"npm run "},{"type":"element","tagName":"span","properties":{"className":["hljs-built_in"]},"children":[{"type":"text","value":"test"}]},{"type":"text","value":":wasm\n"},{"type":"element","tagName":"span","properties":{"className":["hljs-comment"]},"children":[{"type":"text","value":"# With Vite dev or preview running and Google Chrome installed:"}]},{"type":"text","value":"\nnpm run "},{"type":"element","tagName":"span","properties":{"className":["hljs-built_in"]},"children":[{"type":"text","value":"test"}]},{"type":"text","value":":browser\nnpm run "},{"type":"element","tagName":"span","properties":{"className":["hljs-built_in"]},"children":[{"type":"text","value":"test"}]},{"type":"text","value":":xray\nnpm run "},{"type":"element","tagName":"span","properties":{"className":["hljs-built_in"]},"children":[{"type":"text","value":"test"}]},{"type":"text","value":":parsing\nnpm run "},{"type":"element","tagName":"span","properties":{"className":["hljs-built_in"]},"children":[{"type":"text","value":"test"}]},{"type":"text","value":":memory\nlat check\n"}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":72,"data-source-end-line":75},"children":[{"type":"text","value":"Set "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"XRAY_URL=http://127.0.0.1:8001"}]},{"type":"text","value":" to target a preview on another port.\nScreenshots are written to ignored "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"artifacts/"}]},{"type":"text","value":". Native tests use\n"},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":".build/native/python.exe -m unittest discover -s tests -v"}]},{"type":"text","value":" (or "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"python"}]},{"type":"text","value":" where\nthat is the executable name); "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"npm run test:graph"}]},{"type":"text","value":" also uses the native build."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"what-the-trace-means","data-source-start-line":77,"data-source-end-line":77},"children":[{"type":"text","value":"What the trace means"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":79,"data-source-end-line":87},"children":[{"type":"text","value":"Operand stacks are observed "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"before"}]},{"type":"text","value":" each opcode. The parser replay records\nreal token requests, PEG checkpoints, and AST constructors. Opcode tracing\nperturbs specialization, so this is not an uninstrumented performance trace.\nCoroutine suspensions and resumptions retain activation identity. The selected\nasyncio API supports cooperative tasks and timers, without socket or thread I/O.\nPublic standard-library imports such as time, math, json, and collections are\navailable when supported by the bundled WASM runtime. Third-party imports,\nprivate attributes, classes, generators, and dynamic code remain restricted. Live history retains the latest 2,000 events without imposing a total\nexecution-event limit."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":89,"data-source-end-line":93},"children":[{"type":"text","value":"Use "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"Compile"}]},{"type":"text","value":" to build source, token, AST, and opcode views without executing\nPython. "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"Run/Pause"}]},{"type":"text","value":" and "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"Step"}]},{"type":"text","value":" control live execution. Back and the slider\ninspect retained history; resuming returns to the live interpreter. "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"Reset"}]},{"type":"text","value":"\nafter Pause clears the run while preserving compilation. Source edits require\nrecompilation. "},{"type":"element","tagName":"strong","properties":{},"children":[{"type":"text","value":"Stop animation"}]},{"type":"text","value":" skips construction reveal."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":95,"data-source-end-line":99},"children":[{"type":"text","value":"Drag to orbit, use the mouse/trackpad navigation setting for scroll behavior,\nand pinch to zoom the scene. The minimap offers 3D/2D, zoom, and fit controls.\nThe Inspector provides source, instructions, locals, operand stack, and output.\nMobile portrait places execution controls at the bottom; landscape aligns both\ntoolbars at the top. Mouse/trackpad choices are hidden on mobile devices."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":101,"data-source-end-line":101},"children":[{"type":"text","value":"Live stepping uses WebAssembly JSPI where available, or a shared-memory worker gate on Safari and other browsers without JSPI. Serve with the configured Vite preview or Vercel headers: "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"Cross-Origin-Opener-Policy: same-origin"}]},{"type":"text","value":", "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"Cross-Origin-Embedder-Policy: require-corp"}]},{"type

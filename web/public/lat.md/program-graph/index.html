:[{"type":"text","value":"Milestone 2 - Extract graphs and define replay"}]}]},{"type":"text","value":" and the Graphviz baseline from "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout"},"children":[{"type":"text","value":"layout"},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"6 references"},"children":[{"type":"text","value":"6"}]}]},{"type":"text","value":". The first "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/scene"},"children":[{"type":"text","value":"scene"},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":" shares this graph; compiler-intermediate views and clearance-aware routing remain planned."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"bytecode-graph","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"Bytecode graph"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"Capture schema 2 carries explicit instruction flow categories and execution targets. Graph schema 1 groups instructions into stable blocks within each code object, with branch, jump, continuation, and observed-call edges."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/runtime/capture.py/?from=lat.md%2Fprogram-graph%23Program+graph+and+schematic%23Bytecode+graph&line=11#Observer%23code","className":["wiki-link-segmented","wiki-link-code"]},"children":[{"type":"element","tagName":"span","properties":{"className":["code-link-leading"]},"children":[{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["code-link-language","code-language-py"]},"children":[{"type":"text","value":"PY"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"runtime/capture.py#Observer#"}]}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"code"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":" uses CPython disassembly without inline cache entries. Fused instructions retain their decoded identity; extended-argument instructions retain their offsets. IDs combine the recording's code identity and block-start offset, so repeated calls reuse geometry; IDs are not promised stable across source edits."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"In the pinned evaluator, FOR_ITER exhaustion skips END_FOR. Capture preserves the encoded target separately and reports the actual successor as its execution target. This follows "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/bytecodes.c#L3884","className":["external-link"]},"children":[{"type":"text","value":"INSTRUMENTED_FOR_ITER"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":", rather than assuming every encoded jump lands on its disassembled target."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" splits at entry, targets, and instructions following branches, exits, and calls. Splitting after calls gives each call site its own outgoing connection. Unreachable bytecode remains visible and has no recorded visit. The result is an assembled-bytecode CFG, not CPython's optimization CFG. Exceptional unwind is shown in replay state, not fabricated as ordinary control flow."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"replay-projection","data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"Replay projection"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"Every captured event has a deterministic map selection and frame chain. Runtime calls add dashed connections only when a captured Python activation proves the relationship; builtin internals remain opaque."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" tracks the previous opcode separately for each activation, so a callee cannot be mistaken for the caller's next basic block. It matches observed block transitions to static edges and records diagnostics for unmatched transitions. Return and unwind retain the terminating frame in that event's display; subsequent events select the surviving caller."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" incrementally tracks live activations and previous opcodes independently of the retained history window. Completed frames leave the projector after their final snapshot. The UI stores bounded event/state arrays; seeking never runs Python. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" uses the same projector for complete native recordings. Observed calls add graph connections as they occur; geometry stays fixed during live stepping and picks up newly observed connections on a later layout."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"layout-and-interaction","data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"text","value":"Layout and interaction"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"text","value":"A layout worker runs Graphviz through pinned Viz.js. Code-object clusters, block trays, and orthogonal connections form the SVG map. The 3D view expands each tray into opcode tiles."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/layout-worker.mjs/"},"children":[{"type":"text","value":"web/layout-worker.mjs"}]},{"type":"text","value":" uses the pinned dependency in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/package.json/"},"children":[{"type":"text","value":"package.json"}]},{"type":"text","value":". "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/package_web.py/"},"children":[{"type":"text","value":"tools/package_web.py"}]},{"type":"text","value":" stages its self-contained WASM bundle beside CPython assets. Layout has a separate deadline and is discarded on a new capture. Graphviz imports and initialization run inside worker error handling. A failed layout is retried once automatically; callbacks from replaced workers are ignored, and failures without browser error details receive a readable fallback message. The SVG, normalized geometry from "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/layout.mjs/"},"children":[{"type":"text","value":"web/layout.mjs"}]},{"type":"text","value":", and engine version return to the main thread."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/app.mjs/"},"children":[{"type":"text","value":"web/app.mjs"}]},{"type":"text","value":" keeps geometry fixed while replay updates node and edge classes. Users can zoom, scroll, select blocks with pointer or keyboard, inspect their instructions, and seek their next recorded opcode visit. Source, locals, and operand stack follow that event. Syntax failures clear the map. Layout failures leave the execution inspector usable."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"text","value":"The shared layout exposes renderer-independent route polylines, but does not yet provide named ports, clearance guarantees, or crossing bridges. Graphviz may overlap or cross connectors; crossings are not junctions. The libavoid and PCB comparisons in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout#first-routing-experiment","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"layout#Block placement and connection routing#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"First routing experiment"}]},{"type":"element","tagName":"sp

text","value":" checkout, local build directories, frontend output, and macOS metadata. The packaged browser runtime under "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/public/runtime/runtime.json/"},"children":[{"type":"text","value":"packaged runtime manifest"}]},{"type":"text","value":" is committed. The reference checkout remains unchanged. Disposable builds add the observation module described in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/runtime#capture-runtime","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"runtime#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Capture runtime"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":"; performance and undisturbed specialization remain unmeasured."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"comparison-boundary","data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"text","value":"Comparison boundary"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"text","value":"The proposed modes are the adaptive bytecode interpreter with JIT disabled and the same CPython revision with native JIT enabled. They share the front end, Python semantics, and initial interpreter execution."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"text","value":"Use a conventional GIL-enabled build for the first comparison. In this revision, "},{"type":"element","tagName":"a","properties":{"href":"https://

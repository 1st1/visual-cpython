"value":"Warm with integers, then pass a float step"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"How does a different type remain correct?"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":67,"data-source-end-line":67},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Change control flow"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"A separate branch-bearing loop fixture"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"How does an unrecorded branch lead to a side exit?"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":68,"data-source-end-line":68},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Invalidate"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"A separately verified global or attribute dependency mutation"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"How does previously valid optimized code become unavailable?"}]}]}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":70,"data-source-end-line":70},"children":[{"type":"text","value":"Keep type-change, branch-exit, and dependency-invalidation fixtures separate so each lesson has one cause. A float input may trigger different fallback behavior depending on the captured guards; do not label it a particular kind of exit before observing it. Add a helper-call example after the loop works to distinguish interpreter frame switching from JIT trace inlining."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"playback-model","data-source-start-line":72,"data-source-end-line":72},"children":[{"type":"text","value":"Playback model"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":74,"data-source-end-line":74},"children":[{"type":"text","value":"Prefer deterministic replay of validated recordings with explanatory annotations. The browser should not claim to implement CPython or infer an actual native trace from a hand-written animation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":76,"data-source-end-line":76},"children":[{"type":"text","value":"Plan three layers: capture/extraction of CPython artifacts, normalization into a versioned event stream, and renderer-independent playback. A 2D inspector should exercise that event stream before adding 3D. Backward stepping restores snapshots and replays events; it does not reverse a real Python process."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":78,"data-source-end-line":78},"children":[{"type":"text","value":"Each recording should include revision, build settings, platform/architecture, program and inputs, JIT mode, and extraction method. Each artifact or event should have a stable ID, semantic kind, source span when available, relevant code/frame/executor identity, instruction or micro-op position, state change, and provenance. Label provenance as captured, derived, or explanatory. Do not fabricate a source span for a synthetic instruction."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":80,"data-source-end-line":80},"children":[{"type":"text","value":"Capture raw and optimized representations separately. Proposed event families include artifact creation, frame push/pop, instruction execution, reference/stack update, specialization, recording start/stop, executor installation/entry, side exit, deopt, invalidation, and exception. The final schema depends on what instrumentation can reliably expose; not all listed events are currently available as public hooks."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":82,"data-source-end-line":82},"children":[{"type":"text","value":"Controls should include play/pause, step, back, reset, chapter selection, mode selection, speed, and an inspect panel. “Skip warmup” is an explicit timeline jump. Mode changes should restore the corresponding capture at a shared checkpoint or restart, rather than magically enabling JIT in the middle of a mismatched recording."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"evidence-and-validation-plan","data-source-start-line":84,"data-source-end-line":84},"children":[{"type":"text","value":"Evidence and validation plan"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":86,"data-source-end-line":86},"children":[{"type":"text","value":"Before drawing 3D, obtain a minimal set of artifacts and transitions from the pinned revision. Successful validation means correct semantics and provenance, not merely plausible animation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":88,"data-source-end-line":88},"children":[{"type":"text","value":"Use AST, symbol-table, and disassembly facilities for externally inspectable compiler artifacts. CFG and preprocessing details may need internal test interfaces or dedicated extraction; do not imply ordinary "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"dis"}]},{"type":"text","value":" exposes the compiler's full CFG. For runtime bytecode use the appropriate adaptive/cache-aware disassembly and clearly separate it from original code-object output."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":90,"data-source-end-line":90},"children":[{"type":"text","value":"CPython's "},{"type":"element","tagName":"a","properties":{"href":"https://github.c

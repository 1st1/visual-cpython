a99c37d.json"},"[\"tools/build_wasm.py\",\"build\",\"\",0,0]":{"file":"data/source-files/b7365923208ed5cc7483.json","view":"data/source-views/fe08f23e91a8535fc804.json"},"[\"tools/capture.py\",\"run\",\"\",0,0]":{"file":"data/source-files/e7f114242d3dfe3a04bf.json","view":"data/source-views/a9a9d90223fe53f9e6bc.json"},"[\"tools/instrument_parser.py\",\"instrument\",\"\",0,0]":{"file":"data/source-files/b9e50b88cbbe350a51a6.json","view":"data/source-views/6a7b816fa4f2a2757f3f.json"},"[\"tools/package_web.py\",\"package\",\"\",0,0]":{"file":"data/source-files/b80f4e156095e4e966d2.json","view":"data/source-views/6b9ae9b1a1f579c2cd06.json"}},"externals":{}},"responses":{"/api/document?path=scene.md":{"path":"scene.md","tree":{"version":1,"type":"root","children":[{"type":"element","tagName":"h1","properties":{"id":"isometric-x-ray-scene","data-source-start-line":1,"data-source-end-line":1},"children":[{"type":"text","value":"Isometric X-Ray scene"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":3,"data-source-end-line":3},"children":[{"type":"text","value":"The first 3D xray renders every decoded opcode as a separate tile on a ground plane. It shares graph identities, layout, and replay state with the schematic; it does not implement another Python evaluator."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":5,"data-source-end-line":5},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" provides the Three.js renderer. Iso Glow informed the initial visual direction; the current renderer uses project-owned modules and Three.js without importing the Glow toolkit. This is the first scene slice of "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/xray-world"},"children":[{"type":"text","value":"xray-world"},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":", not the completed storyboard."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"shared-geometry","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"Shared geometry"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"Layout schema 1 carries centered ground-plane coordinates for blocks, code-object enclosures, and sampled connection paths. Both renderers originate from the same Graphviz input and preserve stable semantic IDs during replay."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/layout.mjs/"},"children":[{"type":"text","value":"web/layout.mjs"}]},{"type":"text","value":" converts Graphviz points and inch-sized nodes into a common unit, reverses the vertical axis, samples cubic path segments, removes redundant collinear points, and includes arrow endpoints. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/layout-worker.mjs/"},"children":[{"type":"text","value":"web/layout-worker.mjs"}]},{"type":"text","value":" returns this artifact alongside the SVG and engine version."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"The scene maps layout x/y to Three.js x/z, with Three.js y representing height. Code objects become titled dark indigo platforms at 35% opacity; instruction faces remain opaque deep violet with cyan lettering. Basic blocks retain their layout groups and routes without visible trays, outlines, or headings. Platforms blend above the grid without writing depth or casting opaque shadows. Token and AST tiles use darker indigo faces and bodies, including temporary parser nodes. The Cyberdeck keycap-inspired palette reserves raspberry for execution highlights and uses neutral white lighting to preserve the surface colors. Solid control routes use flat ribbons with bevel joins that preserve every routed bend. Shafts stop at a separate triangular arrowhead base; short final segments scale the head to fit. XRay routes attach from the last opcode of each source block to the first opcode of the target block, at the opcode side-face height; observed Python calls remain dashed violet lines. Internal opcode arrows use that same height. Plate and tile geometry uses 70% of its nominal thickness, trimmed from below so top surfaces, labels, and connector clearances remain aligned. Heights are visual categories, not execution cost or memory size."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/connector.mjs/"},"children":[{"type":"text","value":"web/connector.mjs"}]},{"type":"text","value":" builds ribbon shafts and arrowheads. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_connector.mjs/"},"children":[{"type":"text","value":"tools/test_connector.mjs"}]},{"type":"text","value":" checks terminal placement, short segments, and duplicate points. XRay routing is described in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/scene#obstacle-aware-opcode-routing","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"scene#Isometric X-Ray scene#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Obstacle-aware opcode routing"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":"; the schematic retains Graphviz's baseline routes."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"obstacle-aware-opcode-routing","data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"Obstacle-aware opcode routing"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"XRay arrows attach directly to opcode side faces and route around padded tile footprints while retaining every opcode position and logical block group."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/tile-routing.mjs/"},"children":[{"type":"text","value":"web/tile-routing.mjs"}]},{"type":"text","value":" builds an orthogonal free-space grid from tile boundaries and candidate ports. A* search chooses side ports and paths with a small bend penalty. Tiles have 0.13-unit clearance; existing routes reserve 0.22-unit separation for parallel segments, including internal opcode arrows. Multiple ports on each face let connections use distinct lanes. Endpoint stubs meet tile sides at the same height as internal arrows. Routing runs once during scene construction; playback retains the geometry. The shared layout artifact and schematic are unchanged."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_graph.mjs/"},"children":[{"type":"text","value":"tools/test_graph.mjs"}]},{"type":"text","value":" verifies contacts, orthogonality, tile clearance, and parallel spacing across real captures, including loops and calls. Perpendicular crossings may remain and do not represent junctions; bridges and globally optimal routing are not implemented. Fixed placements can make routing impossible, in which case the router reports an error instead of drawing through boxes."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"compact-placement","data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"text","value":"Compact placement"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"text","value":"The layout worker fits the opcode neighborhood to the browser aspect ratio, comparing flow directions and instruction-grid shapes. Geometry stays frozen during playback."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/placement.mjs/"},"children":[{"type":"text","value":"web/placement.mjs"}]},{"type":"text","value":" owns candidate scoring and the shared xray footprint. The score estimates the viewport area needed by opcode blocks, their enclosures, and routes at the current window width-to-height ratio, accounting for the default camera tilt. Earlier pipeline lanes do not influence opcode packing. Projected area and route length are secondary costs. Candidates combine top-down and left-to-right flow with four instruction-grid aspect targets, plus the original baseline. Tile dimensions stay fixed while the number of columns changes; the winning grid shape is shared by Graphviz and the 3D renderer. This is a readability heuristic, not a globally optimal routing claim. Graph tests check portrait versus wide opcode proportions, deterministic selection, tile containment, block non-overlap, and route endpoints. The selected options and all candidate scores, ground areas, and route lengths are retained in the layout artifact. Both schematic and 3D use the winning Graphviz output. The browser passes its window aspect to the layout worker; non-browser callers default to 1.8. Layout chooses the best-fitting candidate without stretching tiles to force an exact ratio."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"text","value":"Pipeline gaps reserve 1.6 world units of padding on each side of a 2.2-unit chevron strip, scaling with zoom. Three fixed-size golden chevrons are centered between the complete neighboring tile/enclosure bounds with equal left/right padding; their placement stays fixed during reveal."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"text","value":"Four titles drawn slightly above a grid-free header strip on the deck identify Stage 1: Source Code, Stage 2: Tokenize, Stage 3: Parse & Compile, and Stage 4: Run Code. Lane activity bounds include a 0.8-unit side margin around artifacts; opcode bounds include routed connections. All lanes share a neutral black deck at 20% opacity and a continuous dot grid without opaque lane rectangles. The deck uses an unlit material so scene lighting cannot tint it. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/frosted-surface.mjs/"},"children":[{"type":"text","value":"web/frosted-surface.mjs"}]},{"type":"text","value":" adds a subtle neutral haze, soft edge sheen, and fine surface grain to the deck and code platforms. Grain fades out below pixel resolution. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/background-blur.mjs/"},"children":[{"type":"text","value":"web/background-blur.mjs"}]},{"type":"text","value":" shares one downsampled star-free nebula texture and two half-float separable blur targets across all plates, capped at a 512-pixel longest edge and rebuilt only when its dimensions or nebula source change. Glass attenuates the sampled background by 38.8% in linear light before blending its surface tint. Half-float intermediates preserve dark gradient precision, and final material dithering suppresses display banding. The deck replaces the sharp background within its bounds; upper plates blend the shared blur with their tint while grid, tiles, and labels remain sharp. Stars remain visible outside the plates but are excluded from the glass texture; ordinary animation requires no repeated blur uploads or passes. Teardown releases the texture, targets, and staging canvas; no per-plate blur pass or refraction is used. Source lines, tokens, and AST nodes sit directly over that grid without backing plates; their individual tiles and tree connections retain their existing heights. Activity highlights the dot grid within the padded lane bounds. Machine buildings are omitted; operand values appear only in the Inspector. Before parsing artifacts or an opcode layout exist, the deck fits only the source tiles and Stage 1 title; the minimap shows just that region and camera fitting uses only deck bounds. Source edits refit these compact bounds while preserving relative framing. This source-only deck stays visible during capture and layout computation. Once layout is ready, the deck and all platforms switch to their final bounds in one scene rebuild. There is no platform growth or clipping reveal. The camera instantly compensates for changed projected map bounds, keeping the overall map at the same apparent framing instead of letting a larger map overflow the viewport. Token/AST/opcode construction replay continues within the final footprint. Failed compilation replaces the map with its source and available parsing artifacts. The layout-engine statistics badge is hidden; layout failures appear in the editor message area. Ground size follows the program bounds with a smaller minimum plot; the previous long row of five machines no longer determines the map depth. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" supplies the compact block dimensions and wraps long operation labels to keep text inside them."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"operand-stack-inspection","data-source-start-line":35,"data-source-end-line":35},"children":[{"type":"text","value":"Operand-stack inspection"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":37,"data-source-end-line":37},"children":[{"type":"text","value":"Operand values appear only in the Inspector beside locals and output. There is no 3D stack geometry, stack camera preset, or reserved camera-fit space outside the deck."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":39,"data-source-end-line":39},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/app.mjs/"},"children":[{"type":"text","value":"web/app.mjs"}]},{"type":"text","value":" renders the full captured operand snapshot with the top entry first. Internal NULL sentinels, tagged integers, and Python objects remain distinct. Stepping and seeking replace the snapshot, and events without a sample explicitly say so. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_xray.mjs/"},"children":[{"type":"text","value":"tools/test_xray.mjs"}]},{"type":"text","value":" checks arithmetic operands, rewind, sentinel distinctions, and stacks larger than the former eight-slot display limit."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"runtime-activity-and-construction","data-source-start-line":41,"data-source-end-line":41},"children":[{"type":"text","value":"Runtime activity and construction"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":43,"data-source-end-line":43},"children":[{"type":"text","value":"The map uses four surface-titled pipeline lanes with operand values in the Inspector. Machine buildings are omitted; recorded artifacts and lane highlights convey activity."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":45,"data-source-end-line":45},"children":[{"type":"text","value":"The "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/parsing"},"children":[{"type":"text","value":"parsing"},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"3 references"},"children":[{"type":"text","value":"3"}]}]},{"type":"text","value":" timeline reveals tokens and AST nodes from real capture checkpoints. Active animation brightens lane titles and sends cyan waves through the world-aligned grid dots, leaving the shared deck unpainted. Live opcode snapshots highlight the executing source and instruction. Tokenization and parse/compile light together during construction and parsing playback, avoiding per-event flicker. Live execution and history playback light the run lane. Idle, paused, stepped, and terminal states fade out lane glow. Grid intensity eases in and out over a fraction of a second; reduced motion changes it immediately. Reduced motion freezes the wave. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/grid.mjs/"},"children":[{"type":"text","value":"web/grid.mjs"}]},{"type":"text","value":" draws the base grid and animated brightness in one antialiased shader surface. Muted lavender dots have a fixed world-space size at the original unit-spaced intersections. Small solid discs use derivative-based antialiasing only at their edges. Subpixel opacity compensation makes dots shrink and fade when zooming out rather than retaining a fixed screen size or a blurred halo. Very dense grid samples fade away before merging; space between dots stays transparent. The header retains its thin separator line, with dots suppressed above it. Each dot samples lane membership and wave intensity at its intersection. Wave troughs add no brightness above the idle grid. Internal lane boundaries taper over three grid units; outer deck borders remain fully eligible for highlighting. The grid remains depth-tested against content, but the underlying translucent deck does not write depth and draws first. Runtime lighting describes live or playback activity, not compiler timing."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":47,"data-source-end-line":47},"children":[{"type":"text","value":"Before a capture, source-line tiles appear beneath their lane title on a compact source-only deck. Downstream lanes are omitted until parsing artifacts or the complete opcode layout arrive. Once the complete layout arrives, the staged reveal replays observed token and AST-construction checkpoints, then reveals individual opcode tiles in source-line order. Compiling Custom while the editor is open skips the activity warp and staged reveal, showing the finished layout immediately. The choice is captured when compilation starts and survives layout-worker retries. With the editor closed, the reveal remains available. This reveal can be skipped while active and stages already compiled artifacts; it is not a recording of parser/compiler timing or intermediate AST construction. First compilation and example changes begin with source tiles. Custom recompilation retains the last successful scene until the replacement layout is ready, then redraws and resizes it without a reveal. Failed recompilation keeps the last successful scene visible but cannot run it. Run keeps the compiled scene visible while capturing execution; selecting an example returns to the source-only deck; closing changed Custom source preserves an existing compiled scene while clearing execution."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":49,"data-source-end-line":49},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" colors the active opcode tile hot orange, and the incoming recorded connection, distinguishes exception/unwind events, while the Inspector updates operand values from the same event. Function activations reuse their code-object buildings. Detailed locals, operand values, output, and terminating frame chains remain in the inspector."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":51,"data-source-end-line":51},"children":[{"type":"text","value":"A brief pulse follows an observed incoming edge when event selection changes. It encodes that event's transition, not continuous execution while paused. Selecting another event ends construction immediately; rewind restores recorded state without regenerating geometry. Reduced-motion preference disables the reveal and moving pulse while preserving static highlights."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"source-quadrant-and-fullscreen-workspace","data-source-start-line":53,"data-source-end-line":53},"children":[{"type":"text","value":"Source quadrant and fullscreen workspace"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":55,"data-source-end-line":55},"children":[{"type":"text","value":"The 3D world fills the viewport. Source, token, PEG/AST, and opcode lanes share one map, with collapsible editor and inspector overlays, persistent camera controls, and floating top-right execution controls."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":57,"data-source-end-line":57},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/app.mjs/"},"children":[{"type":"text","value":"web/app.mjs"}]},{"type":"text","value":" previews editor changes before a recording exists. During and after capture, the world retains the submitted source; subsequent edits take effect on the next run. Each physical source line, including blank and comment lines, gets a tile. Columns contain at most 24 lines. Long tile text is ellipsized; the editor and source inspector retain the complete text."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":59,"data-source-end-line":59},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" highlights the recorded source line together with the exact opcode. Parsing shows source/token links and AST construction activity. Opcode reveal shows only AST → opcode links; evaluation clears correspondence links while keeping artifact highlights. These links represent source-location relationships, not control flow or observed compiler data transfers. Missing source locations and non-opcode events have no execution-line highlight. Rewind restores both highlights; source and opcode geometry remain fixed. The Source quadrant camera preset provides an overhead reading view."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":61,"data-source-end-line":61},"children":[{"type":"text","value":"The inspector anchors program output at its bottom in a bounded scroll region. Locals and operand stack occupy separate scrollable columns above it; the remaining inspection content scrolls independently. Keyboard-focusable value and output regions contain scrolling so they do not pan the map."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":63,"data-source-end-line":63},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/placement.mjs/"},"children":[{"type":"text","value":"web/placement.mjs"}]},{"type":"text","value":" shares source-quadrant dimensions between scene construction and candidate scoring. Source-line, token, and AST-node counts are part of the derived graph. Window resizing debounces a fresh layout selection and camera fit; replay position, output, and selected block survive, and the compilation reveal does not restart. Resizing does not rerun Python. The initial opcode reveal illustrates completed compilation, not live parsing; reduced motion or advancing replay immediately reveals all instructions."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"camera-and-selection","data-source-start-line":65,"data-source-end-line":65},"children":[{"type":"text","value":"Camera and selection"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":67,"data-source-end-line":67},"children":[{"type":"text","value":"A 38° perspective camera supports angled and top presets, orbit, pan, zoom, fit, and focus. The default angled view faces the pipeline straight on, with level left-to-right lanes and a downward tilt. Trackpad scrolling pans; pinch gestures zoom."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":69,"data-source-end-line":69},"children":[{"type":"text","value":"The 3D/2D segmented control persists its selection in local storage, defaulting to 3D. 2D locks the camera overhead, disables rotation/tilt, and maps dragging to pan; zoom remains available. Fit, Compile, example changes, and resize respect the mode."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":71,"data-source-end-line":71},"children":[{"type":"text","value":"The default angled preset uses 1.25× zoom over the fitted bounds and a small ground-plane pan to place the map lower in the viewport. The 2D preset remains centered at fit scale."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":73,"data-source-end-line":73},"children":[{"type":"text","value":"First compilation resets to the selected camera mode, first for the source preview and again after the completed layout establishes the expanded scene bounds. Custom recompilation preserves the current orientation, relative zoom, and normalized pan while fitting the replacement extents. A failed custom recompile retains the previous scene and camera. Run capture preserves viewing orientation, zoom relative to map fit, and pan normalized to map size. Camera distance scales by the ratio of new to old perspective-fit bounds and the target moves with the map center, without animation. Source edits also preserve navigation after the initial fit; explicit camera presets and viewport relayout can refit the map. Camera preset changes clear residual orbit/pan damping before fitting. Chrome checks compare compilation framing with an explicit fit in the selected mode."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":75,"data-source-end-line":75},"children":[{"type":"text","value":"Building selection and the accessible block menu share the existing instruction inspector and recorded-visit navigation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":77,"data-source-end-line":77},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/app.mjs/"},"children":[{"type":"text","value":"web/app.mjs"}]},{"type":"text","value":" switches between 3D and schematic without recapturing Python or recomputing layout. An outlined bottom-left selector offers Auto, Mouse, and Trackpad modes, persisted in local storage; Auto is the default. The selector and its mouse/trackpad hint are hidden on iPhone, iPad, iPod, and Android. Detection uses the browser user agent plus Mac platform identity with multiple touch points for desktop-identifying iPads; window size and touchscreen support alone do not hide desktop controls. Touch navigation and saved pointer preferences remain unchanged. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/navigation.mjs/"},"children":[{"type":"text","value":"web/navigation.mjs"}]},{"type":"text","value":" infers trackpads from pinch, two-axis, fractional, or small pixel deltas, and mice from line/page or large integer vertical deltas. This heuristic can misidentify smooth-scrolling mice; explicit overrides remain available. Detection stays fixed until a 250 ms gap between wheel events, preventing pan/zoom changes within a gesture. Trackpad wheel events pan in both screen axes, with line/page delta normalization and Shift-wheel horizontal panning. Mouse wheel events zoom with normalized, bounded deltas. Both modes use left-drag to orbit and right/middle-drag to pan; a visible mode-specific hint beside the selector explains the controls and updates immediately when the setting changes. The explanatory parser/compiler footer is omitted. Ctrl-wheel pinch events zoom the camera directly and cancel browser defaults. Safari gesturestart/change/end events use relative gesture scale, also cancelling page magnification; duplicate Ctrl-wheel input during those gestures is ignored. Middle-drag pans, and touchscreen two-finger pan/pinch remains available. Toolbar zoom buttons remain explicit controls. Isometric, top, and fit controls use outlined cube, grid, and frame-corner icons with tooltips and accessible names. The minimap sits at the top left below the program toolbar; an outlined map toggle before the example dropdown shows or hides it and exposes its on/off state. Explicit visibility choices are saved in local storage and restored on reload. Without a valid saved choice, windows up to 900px wide start hidden and wider windows start visible; this inferred default is not persisted. Its position tracks toolbar height when controls wrap. Hidden minimaps skip canvas drawing. The minimap has no heading or pan buttons; its canvas uses the reclaimed vertical space, with click/drag and left/right arrow keys providing panning. The minimap separates its two view presets from the three zoom controls with extra horizontal space. The top-left program toolbar contains the example selector, Edit, Compile, and the conditional Stop animation action. Edit opens a dismissible source-editor popup. Closing it through Edit, ×, or Escape applies changed source and clears execution. An existing compiled Custom scene stays visible until recompilation succeeds; otherwise the source preview updates. Unchanged text preserves the current scene; compiling while the popup is open applies the text so closing does not discard that compilation. Example changes clear prior execution, render the selected source, and recenter the angled view; manual edits mark the selector Custom. The root document cannot scroll, and overlay scroll containers contain overscroll to prevent gestures from moving the page frame. Page-level Ctrl/Command-wheel, zoom shortcuts, and Safari magnification gestures are cancelled without stopping scene handlers. Touch-action allows UI scrolling but excludes browser pinch/double-tap zoom; viewport scale is fixed where respected. The example dropdown matches the buttons’ 12px font size on desktop and mobile. Mobile code-editor text remains 16px to avoid focus zoom. Browser menus and accessibility overrides remain browser-controlled. Browser tests exercise ordinary wheel input and synthetic Safari gesture events, checking cancellation, camera zoom, and unchanged overlay bounds."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":79,"data-source-end-line":79},"children":[{"type":"text","value":"Pointer raycasts select buildings; the block menu offers keyboard access. Floating scene labels are omitted entirely. Machine names and instruction text remain on their physical surfaces; the minimap identifies pipeline regions, the inspector identifies code objects, and tile highlighting indicates execution. Focus opcode centers the current instruction (or the first instruction of a selected tray) in an overhead reading view."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":81,"data-source-end-line":81},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" caps rendering at 2× pixel ratio and eight million pixels, resizes with its container, and pauses when hidden. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/scene#shared-distance-field-text","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"scene#Isometric X-Ray scene#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Shared distance-field text"}]}]},{"type":"text","value":" replaces per-label canvas textures so the scene can use higher framebuffer resolution. Replacement disposes per-label geometry/materials while retaining shared glyph pages; teardown releases atlas pages, shadow targets, and background canvases. The capture handler stops parsing playback and clears its previous recording, frames, and tokens directly, retaining compatibility with cached parser modules that only expose stop. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_memory.mjs/"},"children":[{"type":"text","value":"tools/test_memory.mjs"}]},{"type":"text","value":" runs three shortest-path captures at 2× display density, checking framebuffer/canvas budgets, zero per-label bitmap backing stores, bounded shared atlas storage, stable GPU resource counts, and the shared background blur’s 512-pixel size cap. These counters do not measure total browser-process or WASM peak memory. If WebGL initialization fails, the workbench selects the schematic; runtime capture remains available. A lost graphics context displays a message directing the user to the schematic or reload."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"minimap-navigation","data-source-start-line":83,"data-source-end-line":83},"children":[{"type":"text","value":"Minimap navigation"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":85,"data-source-end-line":85},"children":[{"type":"text","value":"A top-left minimap shows the source region before compilation and all four pipeline regions afterward, the camera target, and the projected viewport footprint. Clicking or dragging recenters the camera without changing zoom or replay state."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":87,"data-source-end-line":87},"children":[{"type":"text","value":"The minimap contains orientation and zoom controls. Top-right execution controls start with Reset (a stop icon), then use Run/Pause and backward/forward step icons, followed by an Inspect button with a sidebar icon and text label, and a seek slider below that matches the complete button row’s width. The seek slider uses a thin muted track, cyan progress, and a small outlined thumb with a larger interaction area and visible keyboard focus. A borderless label below the slider shows the total steps reached; browsing older snapshots shows “Step x of y” using the selected and latest step numbers. Counts use absolute event positions so they continue beyond the retained history window and clear on Reset. The label is hidden whenever the step count is zero. Starting Run does not show a transient runtime-loading label or capture progress track. Live execution shows Run/Pause; the slider follows retained history. Reset discards only the interpreter, history, and output, keeping compiled artifacts and scene geometry without displaying a message. It stays visible, enables after Pause, and disables after reset or resume. Its right margin matches the gap before Inspector. Button labels cannot be selected as text. Clicking unavailable Run before compilation shows “Click on Compile first.” for about two seconds before fading; Compile dismisses it immediately. Capture/layout work does not show this prerequisite hint. There is no surrounding panel surface. Enabled non-primary playback buttons, including Inspector, show a blue-tinted background and brighter outline on hover. Buttons, dropdowns, and segmented-control dividers share an opaque slate outline; selected camera controls use a shared cyan outline, while primary actions retain raspberry borders and darken to a deeper red on hover. The pointer selector uses cyan text and a tinted background for selection without adding an inner border. Hover adds a blue tint and preserves the selected option’s cyan icon or label. On mobile landscape, program and execution toolbars sit side by side at the same safe-area-aware top offset. Mobile portrait left-aligns execution controls at the bottom with a safe-area-aware inset, keeps the minimap/editor below program controls, and reserves space above execution controls for the Inspector. The prerequisite hint appears above the bottom toolbar. A “Python on Vercel” link with the same 36px height and 5px corner radius as toolbar buttons using the supplied official "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/vercel-logotype.svg/"},"children":[{"type":"text","value":"SVG wordmark"}]},{"type":"text","value":" sits at bottom right on desktop and spans the bottom on mobile, linking to Vercel’s Python availability announcement. Mobile portrait controls and Inspector panels reserve space above it. Its gradient border moves smoothly out and back over a five-second cycle with matching endpoints; reduced-motion settings disable the animation. Toolbar measurements update on content changes and rotation. Narrow desktop windows retain stacked top toolbars. Their pointer selector and hosting link share the bottom row, with the navigation hint immediately above; below 380px the selector moves one row up to prevent overlap. The program toolbar above it provides the persistent minimap toggle, example picker, pencil-icon Edit button, Compile, and a Stop animation button shown during construction."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":89,"data-source-end-line":89},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/minimap.mjs/"},"children":[{"type":"text","value":"web/minimap.mjs"}]},{"type":"text","value":" translates camera and orbit target together on the ground plane. Left/right arrow keys on the focused minimap pan along the pipeline. The footprint updates during orbit, zoom, focus, and resize. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_xray.mjs/"},"children":[{"type":"text","value":"tools/test_xray.mjs"}]},{"type":"text","value":" checks pointer navigation and keyboard panning."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"opcode-tiles-and-inspection","data-source-start-line":91,"data-source-end-line":91},"children":[{"type":"text","value":"Opcode tiles and inspection"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":93,"data-source-end-line":93},"children":[{"type":"text","value":"Every decoded instruction has a persistent 3D box, including instructions never reached in the recording. Invisible basic-block groups preserve layout and control flow, while the exact executing opcode is highlighted independently."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":95,"data-source-end-line":95},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/opcodes.mjs/"},"children":[{"type":"text","value":"web/opcodes.mjs"}]},{"type":"text","value":" defines a serpentine instruction grid and formats decoded arguments. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":" sizes each Graphviz node to contain that grid before routing. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" renders one tile per instruction and arrows between successive tiles. Code-object enclosure platforms, outlines, and titles stay hidden until their first opcode appears; parsing-only mode hides them again. Execution uses tile highlighting rather than a floating active-block badge. Internal arrows appear only after both adjacent tiles exist; inter-tray connectors wait for the source’s last instruction and the destination’s first. AST correspondence links also target revealed tiles only. Skip reveal and execution restore the complete graph without changing layout or camera. Inter-tray connectors remain basic-block control flow; internal arrows show instruction order. Fused bytecodes retain their decoded identity rather than inventing component instructions."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":97,"data-source-end-line":97},"children":[{"type":"text","value":"Outer enclosure headings and the opcode-panel caption identify the code object as “Module Code: "},{"type":"text","value":"”, “Function Code: name”, or “Class Code: name”; unknown kinds fall back to “Code Object #X”. Classification matches captured AST definitions by name and first line. Basic-block trays and headings are not rendered, but their grouping, opcode positions, connections, and IDs remain unchanged. Selecting a block highlights its opcode outlines; individual tiles remain pickable. The panel retains “Block @offset” for precise inspection. Schematic cluster titles share the formatter in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/graph.mjs/"},"children":[{"type":"text","value":"web/graph.mjs"}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":99,"data-source-end-line":99},"children":[{"type":"text","value":"Each tile shows its offset, opcode name, and bounded decoded argument. Shared distance-field glyphs preserve character proportions; text is wrapped or ellipsized instead of stretched to fit. The screen-aligned Opcodes panel retains full captured instruction text, follows execution, or pins a selected tray. It can be hidden with the Opcodes button."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":101,"data-source-end-line":101},"children":[{"type":"text","value":"Clicking a visited tile or panel row seeks the next recorded occurrence of that code/offset, wrapping to the first if needed. Unexecuted panel rows are disabled; their tiles remain inspectable without fabricating execution. Follow execution clears the pinned selection. Only opcode events have an active instruction; call, return, unwind, and terminal positions do not falsely highlight a currently executing opcode."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":103,"data-source-end-line":103},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/runtime/capture.py/?from=lat.md%2Fscene%23Isometric+X-Ray+scene%23Opcode+tiles+and+inspection&line=103#Observer%23code","className":["wiki-link-segmented","wiki-link-code"]},"children":[{"type":"element","tagName":"span","properties":{"className":["code-link-leading"]},"children":[{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["code-link-language","code-language-py"]},"children":[{"type":"text","value":"PY"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"runtime/capture.py#Observer#"}]}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"code"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":" includes bounded disassembly argument text, preserving variable names and arithmetic operators. Code constants use a stable code-name description rather than a process memory address. This is an additive capture-schema-2 field; "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/opcodes.mjs/"},"children":[{"type":"text","value":"web/opcodes.mjs"}]},{"type":"text","value":" falls back to numeric arguments for older captures."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"shortest-path-example","data-source-start-line":105,"data-source-end-line":105},"children":[{"type":"text","value":"Shortest-path example"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":107,"data-source-end-line":107},"children":[{"type":"text","value":"The example selector includes a complete breadth-first search over a small unweighted graph. It exercises a queue, visited-path dictionary, nested loops, branches, subscripts, and a function return within the existing capture limits."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":109,"data-source-end-line":109},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/programs/shortest_path.py/"},"children":[{"type":"text","value":"web/programs/shortest_path.py"}]},{"type":"text","value":" is the canonical source served to the editor and used by tests. Its default graph returns the path from node 0 to node 5. It requires no imports, attribute access, or increased execution budget. The example is loaded on selection; loading failures are reported and stale requests do not replace a newer selection."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"validation-and-packaging","data-source-start-line":111,"data-source-end-line":111},"children":[{"type":"text","value":"Validation and packaging"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":113,"data-source-end-line":113},"children":[{"type":"text","value":"Geometry tests verify stable IDs, finite route coordinates, matching node/enclosure counts, and route endpoints at target bounds. Headless Chrome exercises actual WebGL rendering and the fallback path."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":115,"data-source-end-line":115},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_graph.mjs/"},"children":[{"type":"text","value":"tools/test_graph.mjs"}]},{"type":"text","value":" validates normalized geometry across the existing semantic fixtures, deterministic candidate selection, and a score no worse than the original candidate. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_xray.mjs/"},"children":[{"type":"text","value":"tools/test_xray.mjs"}]},{"type":"text","value":" verifies idle infrastructure, capture-driven buildings, rewind, block-menu selection, ray picking, camera controls, view switching, clearing after syntax errors, observed addition operands/results, stack rewind, NULL versus None, bounded stack overflow, reduced motion, mobile overflow, and capture with WebGL disabled. Opcode checks cover one tile per decoded instruction, decoded operands, exact highlights, seeking, and the shortest-path output. Fullscreen checks cover viewport coverage, editor toggling, source preview with blank/comment lines, ordered pipeline lanes, tandem source/token/AST/opcode highlights, complete reveal, and clearing highlights at the terminal position. The shortest-path layout regression checks different selections for portrait and wide windows. Browser coverage verifies resize-driven layout uses the actual window ratio while retaining replay position and output. It saves screenshots for visual review."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":117,"data-source-end-line":117},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/package_web.py/"},"children":[{"type":"text","value":"tools/package_web.py"}]},{"type":"text","value":" stages the pinned Three.js module, core, OrbitControls, and license from npm beside the other local browser assets. No CDN dependency is required. The existing schematic browser tests remain separate from the new scene checks."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"space-presentation","data-source-start-line":119,"data-source-end-line":119},"children":[{"type":"text","value":"Space presentation"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":121,"data-source-end-line":121},"children":[{"type":"text","value":"The scene uses perspective depth, directional shadows, a slow forward-flight starfield, cool blue accents, and translucent glass overlays. Text and opcode roofs retain contrasting surfaces for readability."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":123,"data-source-end-line":123},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" uses beveled block geometry with restrained outlines, hemisphere fill, and a softer directional key above and behind the viewer that follows camera orbit. A 2,048-pixel percentage-closer-filtered shadow map uses a modest filter radius and reduced shadow intensity for gentle edges without variance-shadow bleeding; it is not a physically simulated area light. Shadow coverage follows the world bounds. Solid surfaces receive shadows, anchoring raised blocks to their platforms. Perspective fit accounts for corner depth, and source/opcode/stack focus plus minimap navigation use perspective camera distances."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":125,"data-source-end-line":125},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/starfield.mjs/"},"children":[{"type":"text","value":"web/starfield.mjs"}]},{"type":"text","value":" renders 36,000 deterministic stars through the xray's existing WebGL renderer: 32,400 distant points and 3,600 nearer points. One background pass draws the cached nebula texture and two instanced quad meshes in three calls. Static instance buffers hold position, radius, and appearance; vertex shaders project depth, wrap travel, and shape flight trails, while fragment shaders evaluate soft Gaussian cores and fading streaks. Ordinary frames update only viewport, time, travel distance, and speed uniforms, with no per-star JavaScript loop or pixel-buffer upload. Screen-space Y inversion is matched by reversed triangle winding so face culling retains the star quads. Background materials disable depth tests and writes; the xray clears depth and preserves background color before drawing the map. The background uses the existing scene framebuffer, without another WebGL context or display canvas."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":127,"data-source-end-line":127},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/nebula.mjs/"},"children":[{"type":"text","value":"web/nebula.mjs"}]},{"type":"text","value":" generates a cached warped fractal-noise texture with cloud filaments, dark dust lanes, and muted rose, blue, teal, and amber gas. The frosted plates continue sampling a separate cached star-free blur of that texture. Disposal releases the background texture, instance geometry, and materials. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_starfield.mjs/"},"children":[{"type":"text","value":"tools/test_starfield.mjs"}]},{"type":"text","value":" checks three background calls, unchanged attribute versions during animation, visible motion, reduced-motion freezing, subpixel brightness stability, and GPU resource disposal. Full-scene and repeated-capture tests cover composition and resource bounds."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":129,"data-source-end-line":129},"children":[{"type":"text","value":"The background shares the renderer animation loop but is independent of the map camera and replay clock. Hidden scenes pause and reduced motion freezes movement. Compile, execution capture, construction reveal, and trace playback ease into the same cruising speed; cancellation, failure, pause or completion releases the corresponding activity. Acceleration shifts trail colors toward icy blue and adds a faint central glow. These effects indicate activity rather than execution speed or physical Doppler spectra. Star projection and shading execute on the GPU; the animation callback and render submission still run on the UI thread. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/stars.svg/"},"children":[{"type":"text","value":"web/stars.svg"}]},{"type":"text","value":" remains the non-WebGL background fallback, and "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/style.css/"},"children":[{"type":"text","value":"web/style.css"}]},{"type":"text","value":" supplies the surrounding interface glass styling."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"asyncio-example","data-source-start-line":131,"data-source-end-line":131},"children":[{"type":"text","value":"Asyncio example"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":133,"data-source-end-line":133},"children":[{"type":"text","value":"The example selector includes concurrent odd and even number tasks, demonstrating coroutine suspension and resumption with real one-second timer delays."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":135,"data-source-end-line":135},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/programs/asyncio_numbers.py/"},"children":[{"type":"text","value":"web/programs/asyncio_numbers.py"}]},{"type":"text","value":" runs two coroutines with asyncio.gather, printing odd numbers 1–9 and even numbers 2–10. Each sleeps between its prints, skipping the final unnecessary sleep. Live stepping introduces additional wall-clock delay at opcode boundaries; there is no total execution deadline. WASM tests verify output and completion; Chrome checks load the example through the selector and capture it."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"python-syntax-highlighting","data-source-start-line":137,"data-source-end-line":137},"children":[{"type":"text","value":"Python syntax highlighting"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":139,"data-source-end-line":139},"children":[{"type":"text","value":"CodeMirror provides Python editing, while source inspection and 3D tiles use a lightweight presentation lexer. Keywords, builtins, strings, numbers, comments, and operators receive consistent colors distinct from execution highlighting."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":141,"data-source-end-line":141},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/python-syntax.mjs/"},"children":[{"type":"text","value":"web/python-syntax.mjs"}]},{"type":"text","value":" preserves source text and handles multiline strings across source tiles. It is a display lexer rather than a Python parser; string interpolation is colored as a string. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/editor.mjs/"},"children":[{"type":"text","value":"web/editor.mjs"}]},{"type":"text","value":" embeds CodeMirror with Python syntax, line numbers, undo/redo, four-space Tab indentation, Shift-Tab outdent, and inline compilation diagnostics. Edits exceeding 16 KiB are rejected with a message, while compilation and sharing enforce the 256-token limit. Cmd+Enter or Ctrl+Enter compiles without inserting a newline; the shortcut is inactive while compilation is busy or sharing is open. Compilation error messages sit below the editor while source ranges remain marked inline. Escape closes the popup; changes still autosave on close. DOM highlighting uses textContent rather than HTML interpolation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"shared-distance-field-text","data-source-start-line":143,"data-source-end-line":143},"children":[{"type":"text","value":"Shared distance-field text"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":145,"data-source-end-line":145},"children":[{"type":"text","value":"World-space labels share a bounded glyph atlas, keeping text sharp across zoom levels without a separate bitmap for each block."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":147,"data-source-end-line":147},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/text-atlas.mjs/"},"children":[{"type":"text","value":"web/text-atlas.mjs"}]},{"type":"text","value":" rasterizes each encountered character once into a temporary 64×64 canvas, computes a signed distance field, and packs it into single-channel 1,024×1,024 atlas pages. Up to four pages are retained per scene lifetime; unseen characters beyond that budget use a replacement glyph. Shared pages survive capture rebuilds and are disposed with the renderer."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":149,"data-source-end-line":149},"children":[{"type":"text","value":"Each label batches glyph quads by atlas page. A derivative-based shader reconstructs antialiased edges at the current pixel scale. Source syntax colors and execution highlighting are vertex colors, and tile backgrounds are ordinary colored planes. Source lettering uses 28% of the tile depth. Source tiles measure the current program with the same glyph advances used for rendering, fitting a minimum 35-character code area or the widest line, whichever is larger, plus five spaces and its line-number gutter. The resulting tile width and column pitch also drive lane bounds, source focus, and outgoing links. Stage titles use a larger 0.9-unit text surface within the header strip. Labels remain real depth-tested geometry on block surfaces; no HTML label overlay is substituted. Memory savings fund the higher-resolution scene buffer, while the starfield retains its lower pixel budget."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":151,"data-source-end-line":151},"children":[{"type":"text","value":"Backing planes and glyphs use successively stronger constant and slope depth biases, with physical separation between layers. This prevents both crawling patches on tile faces during panning and missing letter fragments. Depth testing remains enabled for occlusion. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_text.mjs/"},"children":[{"type":"text","value":"tools/test_text.mjs"}]},{"type":"text","value":" compares the complete tile surface above a solid block against an unoccluded reference at 45 combinations of pan, distance, and elevation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"opcode-transition-trail","data-source-start-line":153,"data-source-end-line":153},"children":[{"type":"text","value":"Opcode transition trail"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":155,"data-source-end-line":155},"children":[{"type":"text","value":"A brief fiery raspberry trail connects the previous and current opcode tiles during forward replay, retracting toward the newly active instruction without covering either endpoint label."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":157,"data-source-end-line":157},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/opcode-trail.mjs/"},"children":[{"type":"text","value":"web/opcode-trail.mjs"}]},{"type":"text","value":" implements a world-space shader inspired by "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/0xhckr/ghostty-shaders/blob/main/cursor_blaze.glsl","className":["external-link"]},"children":[{"type":"text","value":"cursor_blaze"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":", using original GLSL with a rose core and raspberry edges, subtle moving flame tongues, and a half-second retracting fade. The ribbon uses tile footprints for its maximum width, with a conical taper from full width at the midpoint to zero at both tile centers. The fragment shader shapes this taper on the reusable quad; endpoint masks keep the labels clear, including diagonal transitions. One reused plane and material require no texture or framebuffer allocations. It shows observed execution-cursor movement, not an additional control-flow edge."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":159,"data-source-end-line":159},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" triggers it only when the recorded event changes to a different opcode. Selection updates do not restart it. Reset, backward seeking, parsing, recapture, terminal events, and reduced motion clear or suppress the effect; teardown disposes its resources. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_opcode_trail.mjs/"},"children":[{"type":"text","value":"tools/test_opcode_trail.mjs"}]},{"type":"text","value":" verifies orientation in every direction, expiry, reduced motion, and disposal. Headless Chrome scene checks verify the effect starts on a replay step and expires afterward."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"grid-continuity-checks","data-source-start-line":161,"data-source-end-line":161},"children":[{"type":"text","value":"Grid continuity checks"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":163,"data-source-end-line":163},"children":[{"type":"text","value":"The grid must remain continuous across close-up, distant, and oblique views, with identical geometry for idle and active states."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":165,"data-source-end-line":165},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_grid.mjs/"},"children":[{"type":"text","value":"tools/test_grid.mjs"}]},{"type":"text","value":" samples visible grid edges and fractional-position header separators across 108 distance, elevation, pan, and activity combinations in headless Chrome, checking contrast against the deck and shader compilation errors."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"integrated-opcode-inspector","data-source-start-line":167,"data-source-end-line":167},"children":[{"type":"text","value":"Integrated opcode inspector"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":169,"data-source-end-line":169},"children":[{"type":"text","value":"Opcode navigation lives inside the Inspector rather than floating over the scene. The list follows execution or stays pinned to a selected block."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":171,"data-source-end-line":171},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" mounts its opcode list directly in the Inspector. Selecting a scene block opens the Inspector; stepping, playback, or seeking releases the selection and follows the current execution. There is no block dropdown, focus/visit shortcut, or Follow execution button. Visited instructions can seek to recorded visits; unexecuted instructions remain readable but disabled. Before execution, the compiled entry block is shown by default. Source position, locals, operand stack, and output remain in the same panel; the interactive opcode list is the sole instruction view, without redundant code-object or block-details dumps. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_xray.mjs/"},"children":[{"type":"text","value":"tools/test_xray.mjs"}]},{"type":"text","value":" verifies Inspector ownership and opcode navigation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"source-line-navigation","data-source-start-line":173,"data-source-end-line":173},"children":[{"type":"text","value":"Source-line navigation"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":175,"data-source-end-line":175},"children":[{"type":"text","value":"Source lines in the Inspector and source tiles on the 3D deck seek to the next recorded visit to that line, wrapping to its first visit after the last one."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":177,"data-source-end-line":177},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/source-navigation.mjs/"},"children":[{"type":"text","value":"web/source-navigation.mjs"}]},{"type":"text","value":" identifies visits from opcode events when the line or frame changes, or the instruction offset loops backward. Consecutive opcodes within one visit are skipped. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/app.mjs/"},"children":[{"type":"text","value":"web/app.mjs"}]},{"type":"text","value":" pauses playback and follows the sought event; lines with no recorded visit do nothing and are disabled in the Inspector. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/web/xray.mjs/"},"children":[{"type":"text","value":"web/xray.mjs"}]},{"type":"text","value":" raycasts source tile bodies through the same callback, with the existing drag threshold preventing orbit gestures from seeking. "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/code/tools/test_source_navigation.mjs/"},"children":[{"type":"text","value":"tools/test_source_navigation.mjs"}]},{"type":"text","value":" checks visit grouping, wraparound, both click target

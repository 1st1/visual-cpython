lops "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/xray-world#stable-layout-and-controlled-detail","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"xray-world#Program-built X-Ray world#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Stable layout and controlled detail"}]}]},{"type":"text","value":". The immediate scope excludes JIT machinery and native execution. Existing JIT research remains a future reference rather than a requirement for the first layout."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"placement-at-two-scales","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"Placement at two scales"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"Keep the infrastructure map authored and stable, while generating the program neighborhood from its code objects and control-flow graphs. Automatic layout should solve the variable portion of the scene."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"text","value":"Place parser/compiler, evaluator, frames, and object storage in explicit zones around the program plot. Measure component footprints, label space, and routing clearance before layout. Use a local coordinate system for each code-object enclosure; pack completed enclosures into the plot with space for connection corridors."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"Use Graphviz dot to lay out basic blocks within each enclosure, with a consistent direction, ranks, and branch ordering. Supply fixed node dimensions, stable IDs, and stable input ordering. Treat loop-back edges separately in ranking and reserve perimeter lanes for their eventual routes. These are layout constraints, not a change to the program's edges. Exception edges and selected reference relationships can appear in additional inspection layers rather than forcing every possible relationship into the primary CFG layout."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"text","value":"Graphviz's "},{"type":"element","tagName":"a","properties":{"href":"https://graphviz.org/docs/layouts/dot/","className":["external-link"]},"children":[{"type":"text","value":"dot engine"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" provides directed layered layout, ranking controls, and crossing/length heuristics. It is a candidate placement engine, not a guarantee of optimal coordinates or stability after graph edits. Use local layouts to limit unrelated movement, and freeze positions for playback."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"Read computed positions and dimensions from "},{"type":"element","tagName":"a","properties":{"href":"https://graphviz.org/docs/outputs/json/","className":["external-link"]},"children":[{"type":"text","value":"Graphviz JSON output"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":", normalize its coordinate units, then perform grid compaction and collision checks. Do not merely round coordinates independently: that can close routing corridors or overlap enlarged footprints. Lay out on the ground plane before projecting it into 3D."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"routing-candidates","data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"Routing candidates"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"text","value":"Evaluate obstacle avoidance and port handling separately from node placement. The preferred initial candidate is Graphviz for placement plus libavoid for orthogonal connectors."}]},{"type":"text","value":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"type":"element","tagName":"table","properties":{},"children":[{"type":"element","tagName":"thead","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Candidate"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Intended experiment"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Constraint"}]}]}]},{"type":"element","tagName":"tbody","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Graphviz alone"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Establish a cheap baseline with orthogonal paths"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Its documented orthogonal routing does not handle ports or dot edge labels"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":26,"data-source-end-line":26},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Graphviz plus libavoid"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Route around measured footprints using named connection points"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Must validate spacing, grid alignment, crossings, and browser integration"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Graphviz plus Freerouting"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Compare PCB-style clearance and multilayer routing on a difficult fixture"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Requires a circuit-format adapter and a separate execution/deployment strategy"}]}]}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"text","value":"Graphviz's "},{"type":"element","tagName":"a","properties":{"href":"https://graphviz.org/docs/attrs/splines/","className":["external-link"]},"children":[{"type":"text","value":"splines documentation"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" explicitly records the orthogonal-router port/label limitation. Its routes are useful for comparison but should not be assumed to attach correctly to our semantic ports."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"element","tagName":"a","properties":{"href":"https://www.adaptagrams.org/documentation/libavoid.html","className":["external-link"]},"children":[{"type":"text","value":"libavoid"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" is a native C++ connector router for interactive diagrams. It supports object-avoiding orthogonal paths. Its "},{"type":"element","tagName":"a","properties":{"href":"https://www.adaptagrams.org/documentation/router_8h.html","className":["external-link"]},"children":[{"type":"text","value":"routing controls"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" include shape clearance, segment and crossing penalties, port-direction penalties, and separation of nearby paths. These controls make it a closer fit than a general force-directed graph library, but penalties are not hard zero-crossing guarantees."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"element","tagName":"a","properties":{"href":"https://www.freerouting.org/freerouting/manual/routing-options","className":["external-link"]},"children":[{"type":"text","value":"Freerouting's routing options"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" support clearance rules, permitted layers, via choices, and route-length reduction. It is a useful experimental comparator for routing quality. Adapt block terminals to pins, independent connections to nets, obstacles to keepouts, and elevated routes to extra layers; export through a supported circuit format. Do not adopt physical-board assumptions such as electrically joining distinct control paths just because they meet the same component."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":35,"data-source-end-line":35},"children":[{"type":"text","value":"Graphviz can run in the browser through the native engine's "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/hpcc-systems/hpcc-js-wasm","className":["external-link"]},"children":[{"type":"text","value":"HPCC WebAssembly distribution"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":". Use JavaScript for orchestration, not a replacement layout algorithm. A pinned libavoid WASM build or suitable binding needs a feasibility check; browser deployment of the PCB comparator is not assumed. No native dot executable was found on PATH during this research."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"ports-and-connection-semantics","data-source-start-line":37,"data-source-end-line":37},"children":[{"type":"text","value":"Ports and connection semantics"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":39,"data-source-end-line":39},"children":[{"type":"text","value":"Each component declares its footprint, clearance envelope, and named ports before routing. Connections attach to exact terminals and retain their meaning throughout playback."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":41,"data-source-end-line":41},"children":[{"type":"text","value":"Ports specify position, allowed exit direction, and connection kind. A conditional block exposes distinct branch outputs with stable labels. Give loop-back routes dedicated entry lanes where needed. Route outward through a short unobstructed terminal stub before turning, avoiding ambiguous runs along a building edge."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":43,"data-source-end-line":43},"children":[{"type":"text","value":"Different connections may share a source without becoming one visual wire. Explicit junctions represent intentional branching; an incidental crossing is never a junction. Separate lanes for control flow and selected object references prevent a load operation from looking like a control transfer. Source spans and prose labels belong in readable panels or reserved areas, not over unconstrained wire segments."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"clearance-before-shortest-distance","data-source-start-line":45,"data-source-end-line":45},"children":[{"type":"text","value":"Clearance before shortest distance"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":47,"data-source-end-line":47},"children":[{"type":"text","value":"Require legal endpoints and obstacle clearance first, then optimize crossings, bends, and route length. The shortest isolated path is not always the best route for the complete map."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":49,"data-source-end-line":49},"children":[{"type":"text","value":"Use a priority order: valid ports and no component penetration; no unmarked crossings or unrelated shared segments; sufficient wire spacing; few bridges; few bends; short total Manhattan length; minimal changes from a previous layout. Treat the exact relative costs as experimental parameters, and report route quality rather than claiming a global optimum."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":51,"data-source-end-line":51},"children":[{"type":"text","value":"A nonplanar graph cannot always be drawn crossing-free on one plane, and fixed ports impose additional constraints. On failure, widen a corridor or move blocks before escalating to an explicit bridge or underpass. A 3D bridge needs clearance from buildings and other routes and must remain understandable in the default camera. Two routes on separate heights can still overlap in screen projection, so inspect the projected view as well."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":53,"data-source-end-line":53},"children":[{"type":"text","value":"libavoid produces planar routes; bridge assignment and height changes would be our additional pass. Do not imply that this router automatically solves multilayer routing. If a route remains invalid, show a diagnostic in the prototype and retry layout with more space rather than silently drawing through an obstacle."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"layout-artifact-and-lifecycle","data-source-start-line":55,"data-source-end-line":55},"children":[{"type":"text","value":"Layout artifact and lifecycle"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":57,"data-source-end-line":57},"children":[{"type":"text","value":"Persist a renderer-independent map description containing positioned components, ports, routed polylines, and any explicit crossings. Playback changes state and highlights, not the map's topology on every instruction."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":59,"data-source-end-line":59},"children":[{"type":"text","value":"The proposed artifact includes graph/version identity, component bounds, enclosure bounds, named terminal positions, edge semantics, ground-plane waypoints, bridge annotations, and layout diagnostics. The renderer turns these coordinates into buildings and paths; execution events refer to stable component and edge IDs."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":61,"data-source-end-line":61},"children":[{"type":"text","value":"Compute the complete static layout before the staged compilation reveal, then reveal its pieces in semantic order. This preserves the appearance of construction without repeatedly shuffling existing buildings. Runtime allocations use bounded display slots or expandable inspectors; they do not continuously relayout the CFG. New source triggers a new layout, with deterministic inputs and preservation of unchanged neighborhoods where practical."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"first-routing-experiment","data-source-start-line":63,"data-source-end-line":63},"children":[{"type":"text","value":"First routing experiment"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":65,"data-source-end-line":65},"children":[{"type":"text","value":"Compare routing quality in a plain top-down view before adding 3D geometry. Use identical footprints, ports, and input graphs so placement changes do not disguise routing weaknesses."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":67,"data-source-end-line":67},"children":[{"type":"text","value":"Fixtures should include a straight chain, a branch/rejoin diamond, nested loops, multiple function enclosures, a high-degree shared target, explicit exception edges, and a deliberately nonplanar graph. Include two nearby source revisions to measure unwanted movement. Synthetic stress fixtures test geometry; source-derived CFGs test whether the result explains real code."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":69,"data-source-end-line":69},"children":[{"type":"text","value":"First compare Graphviz-only with Graphviz plus libavoid. Then try the PCB router on the hardest fixed-placement fixture. Record node overlaps, edge-obstacle collisions, endpoint/direction violations, unrelated segment overlaps, crossings, minimum clearance, bends, bridges, total length, bounds, runtime, and movement after an edit."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":71,"data-source-end-line":71},"children":[{"type":"text","value":"The acceptance gate is valid, readable geometry with stable playback, not the shortest wiring at any cost. Keep adapters behind one layout-artifact contract so the best routing approach can be selected from evidence. JIT layouts and 3D art are outside this first experiment."}]}]},"title":"Block placement and connection routing","gitTree":null,"tableOfContents":[{"id":"block-placement-and-connection-routing","title":"Block placement and connection routing","depth":1,"errorCount":0,"hasGitChanges":false},{"id":"placement-at-two-scales","title":"Placement at two scales","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"routing-candidates","title":"Routing candidates","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"ports-and-connection-semantics","title":"Ports and connection semantics","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"clearance-before-shortest-distance","title":"Clearance before shortest distance","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"layout-artifact-and-lifecycle","title":"Layout artifact and lifecycle","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"first-routing-experiment","title":"First routing experiment","depth":2,"errorCount":0,"hasGitChanges":false}],"graphNodeIds":{"":"document:layout.md"},"errors":[],"backReferences":[{"sectionId":"lat.md/layout#Block placement and connection routing","headingId":"block-placement-and-connection-routing","references":[{"kind":"markdown","sectionId":"lat.md/cpython#CPython visualization plan","breadcrumbs":["cpython","CPython visualization plan"],"paragraph":"layout evaluates Graphviz placement and diagram/circuit routing for the interpreter-only map.","paragraphTree":{"version":1,"type":"root","children":[{"type":"element","tagName":"p","properties":{"data-source-start-line":12,"data-source-end-line":12},"children":[{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout","className":["wiki-link-active"]},"children":[{"type":"text","v

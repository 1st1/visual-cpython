re. The following flows are checked against the current bytecode definitions, optimizer, and native emitter rather than assuming an older release's JIT design."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"adaptive-execution","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"Adaptive execution"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"Show the current frame, its instruction pointer, local slots, evaluation stack, and references to objects. Bytecode dispatch changes this state; the frame stack changes on calls and returns."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/ceval.c#L658","className":["external-link"]},"children":[{"type":"text","value":"PyEval_EvalCode"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" provides an execution entry and "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/ceval.c#L1234","className":["external-link"]},"children":[{"type":"text","value":"_PyEval_EvalFrameDefault"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" implements default frame evaluation. The "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Include/internal/pycore_interpframe_structs.h#L23","className":["external-link"]},"children":[{"type":"text","value":"_PyInterpreterFrame layout"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" includes previous-frame linkage, instruction and stack pointers, and local/stack slots using stack references. Do not depict these slots as copied heap objects or assume every internal reference is a raw owning pointer."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"For an expression such as "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"a + b"}]},{"type":"text","value":", show references loaded into the evaluation stack, operands consumed by the operation, and a result reference made available. Exact opcodes, fused operations, and intermediate stack states must come from the chosen build. The evaluation stack inside one frame is distinct from the stack of activations. Common Python-to-Python calls switch frames inside the evaluator; they need not recursively enter a new C evaluator call for every Python call."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"text","value":"Specialization belongs in the regular mode. "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/specialize.c#L2339","className":["external-link"]},"children":[{"type":"text","value":"_Py_Specialize_BinaryOp"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" can select an integer-add implementation, and the "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/bytecodes.c#L712","className": :"text","value":" checks a counter at eligible loop-back or resume sites and calls "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/optimizer.c#L1117","className":["external-link"]},"children":[{"type":"text","value":"_PyJit_TryInitializeTracing"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":". Recording interleaves with actual interpreter execution: "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/bytecodes.c#L6571","className":["external-link"]},"children":[{"type":"text","value":"TRACE_RECORD"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" translates executed bytecodes into micro-ops and records required live values. It is not a static translation of an entire function, and one bytecode may expand into several micro-ops."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/ceval.c#L1090","className":["external-link"]},"children":[{"type":"text","value":"stop_tracing_and_jit"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" invokes "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/optimizer.c#L129","className":["external-link"]},"children":[{"type":"text","value":"_PyOptimizer_Optimize"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":". The optimizer's "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/optimizer.c#L1648","className":["external-link"]},"children":[{"type":"text","value":"uop_optimize"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" calls "},{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/optimizer_analysis.c#L805","className":["external-link"]},"children":[{"type":"text","value":"_Py_uop_analyze_and_optimize"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":", which performs data-flow analysis and removes unneeded operations. It constructs an executor, with native compilation under the native-JIT build flag. Show a before/after trace with the reason for each illustrated deletion; do not invent eliminated guards without capture evidence."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"element","tagName":"a","properties":{"href":"https://github.com/python/cpython/blob/036d309cf542986a39eeba5ca805b2ec7619731d/Python/optimizer.c#L93","className":["external-link"]},"children":[{"type":"text","value":"insert_executor"},{"type":"element","tagName":"span","properties":{"ariaHidden":"true","className":["external-link-icon"]},"children":[]}]},{"type":"text","value":" stores an executor on the code object and replaces the entry instruction with "},{"type":"element","tagName":"code","properties":{},"children":[{"type":"text","value":"ENTER_EXECUTOR"}]},{"type":"text","value":". "},{"type":"element","tagName":"a","properties":{"href":"https://

nted capture slice."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":5,"data-source-end-line":5},"children":[{"type":"text","value":"The visual contract comes from "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/xray-world#program-built-x-ray-world","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"xray-world#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Program-built X-Ray world"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":", the layout candidates from "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout#block-placement-and-connection-routing","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"layout#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Block placement and connection routing"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"6 references"},"children":[{"type":"text","value":"6"}]}]},{"type":"text","value":", and the semantic model from "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/compilation#shared-compilation-flow","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"compilation#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Shared compilation flow"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":" and "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/execution#adaptive-execution","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"execution#Interpreter and JIT execution#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Adaptive execution"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"user-visible-completion-target","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"User-visible completion target"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"A user edits a short program, runs it, watches connected program blocks appear, and inspects execution through source highlighting, frames, locals, operand-stack changes, and output."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"text","value":"Provide an editor with examples, compile/run, play/pause, forward/back step, reset, speed, and skip-construction controls. The scene includes fixed compiler/runtime machinery, generated code-object enclosures with basic blocks, routed control-flow connections, and a focused activation/objects area. Selection links source, instructions, map blocks, and an inspector. Include orthographic/isometric view, pan/zoom, and optional orbit; camera motion is never necessary to understand the default example."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"The initial supported program surface is self-contained synchronous code: primitive values, assignment, arithmetic/comparisons, if/else, for/while, ordinary functions/calls/returns, basic lists/dictionaries, and a small allowlist of builtins such as print, range, and len. Include syntax errors and runtime exceptions with a clear termination/unwind display. Verify the exact supported operations in a capability matrix before enabling them in the editor."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"text","value":"Explicitly defer JIT, arbitrary imports/packages, host filesystem/network access, eval/exec, threading, async/generators, user-defined classes, full heap/GC visualization, and performance comparisons. Diagnose unsupported constructs before running where practical. This is an initial visualization contract, not a claim that the WASM interpreter cannot execute other Python features."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"Use a proposed 200-token limit counted by Python's tokenizer, excluding comments, encoding/end markers, and layout-only tokens. Also cap source bytes, execution time, trace events, output, object-preview depth, and runtime memory. Token count alone cannot bound loops, allocations, or literal size. Select concrete execution/memory defaults from the feasibility runs and document them before release."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"architecture-and-durable-artifacts","data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"Architecture and durable artifacts"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"text","value":"Separate execution, graph extraction, layout, playback, and rendering so each stage can be validated independently. Both native development captures and browser captures should feed the same replay model."}]},{"type":"text","value":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"type":"element","tagName":"table","properties":{},"children":[{"type":"element","tagName":"thead","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Layer"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Responsibility"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Durable output"}]}]}]},{"type":"element","tagName":"tbody","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"CPython build and capture"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Compile source and collect safe interpreter state/events"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Versioned program artifacts and execution trace"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":26,"data-source-end-line":26},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Graph extraction"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Map code objects and instructions into basic blocks and edges"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Semantic graph with stable IDs and source mappings"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Placement and routing"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Arrange measured components and connect named ports"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Validated bounds, ports, paths, bridge annotations"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":28,"data-source-end-line":28},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Playback"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Apply events to state; restore snapshots for rewind"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Deterministic scene-state model"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Renderer and UI"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Render that state and accept user inspection/control"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Interactive xray and explanatory panels"}]}]}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"text","value":"Use TypeScript for the application and playback model, Three.js for the final scene, CPython compiled with Emscripten for execution, and native layout/routing algorithms exposed through WASM where feasible. Pin the exact dependency versions after the feasibility work. Use project-owned Three.js modules for visual primitives and controls."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"text","value":"Keep CPython execution in its own worker and layout in a separate worker. Only compact serializable artifacts/events cross into the UI; do not pass live Python objects. The UI's playback clock is independent of capture speed. For v1, finish or truncate a bounded recording before playback rather than attempting interactive suspension at every instruction."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":35,"data-source-end-line":35},"children":[{"type":"text","value":"Track build recipes, instrumentation patches, fixture programs, schemas, and small expected traces in this repository. Keep the local CPython checkout ignored and unmodified as a reference; build from an exact revision in a disposable worktree/copy with tracked patches applied. Record revision, build flags, instrumentation/schema versions, and capture limits in every trace. Avoid claiming that generated build artifacts or modifications hidden in the ignored checkout are reproducible source."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-1---prove-runtime-capture-and-wasm","data-source-start-line":37,"data-source-end-line":37},"children":[{"type":"text","value":"Milestone 1 - Prove runtime capture and WASM"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":39,"data-source-end-line":39},"children":[{"type":"text","value":"Establish that the pinned CPython can run in a browser worker and expose the execution state the xray needs. Detailed observation is the primary technical risk, so test it before building the full scene."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":41,"data-source-end-line":41},"children":[{"type":"text","value":"First reproduce a minimal integer-add/function-call capture natively, where debugging is easier. Compile the same instrumented revision to WASM and run it through a minimal worker harness. Verify stdout, errors, fresh-run isolation, and cancellation by discarding/recreating the worker. Enforce execution budgets independently of catchable Python exceptions; configure and test a WASM memory bound appropriate to the runtime's baseline footprint."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":43,"data-source-end-line":43},"children":[{"type":"text","value":"Capture stable code/frame/object identities, source/instruction positions, local changes, operand-stack state at safe boundaries, call/return, branches, and errors. Inspect generated evaluator semantics before choosing hook locations: fused instructions, dispatch, and stack-pointer synchronization must be handled correctly. Do not infer runtime stack values from static stack-effect counts alone."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":45,"data-source-end-line":45},"children":[{"type":"text","value":"Serialize bounded primitive/container previews without invoking arbitrary user repr methods or retaining unlimited strong references. Handle aliases, cycles, and object-ID lifetime deliberately. Treat builtin implementation internals as opaque operations in v1; display their arguments/results and observable effects rather than pretending to step every C operation."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":47,"data-source-end-line":47},"children":[{"type":"text","value":"Python-level tracing may validate early calls/lines/locals, but it is not sufficient evidence for the full stack display or undisturbed specialization. The deliverable requires either suitable internal hooks or a clearly documented narrower observed mode. Verify ordinary specialization under the final hooks before adding specialization claims to the UI."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":49,"data-source-end-line":49},"children":[{"type":"text","value":"Exit gate: the same small program produces consistent semantic results and coherent frame/stack transitions in native and browser captures; an infinite loop can be stopped without freezing the UI. If this fails, resolve or explicitly revise the capture scope before proceeding to polished 3D."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-2---extract-graphs-and-define-replay","data-source-start-line":51,"data-source-end-line":51},"children":[{"type":"text","value":"Milestone 2 - Extract graphs and define replay"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":53,"data-source-end-line":53},"children":[{"type":"text","value":"Turn compiler artifacts and captured events into a stable model that can power both a diagnostic inspector and the final xray. Rewind restores recorded state rather than re-executing Python."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":55,"data-source-end-line":55},"children":[{"type":"text","value":"Collect tokens, AST, symbol information, nested code objects, disassembly, constants/names, source positions, and exception metadata. Construct a runtime CFG from final bytecode boundaries and branch targets. Mark that CFG as derived from assembled bytecode; it is not the compiler's pre-assembly optimization graph. Defer exact compiler intermediate snapshots unless inexpensive hooks provide them faithfully."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":57,"data-source-end-line":57},"children":[{"type":"text","value":"Normalize bytecode offsets, extended arguments, cache entries, and fused instructions before identifying basic blocks. Keep source relationships many-to-many. Code-object IDs persist across repeated calls; frame IDs distinguish activations. Static call relationships are hints unless resolved by evidence; actual calls come from execution events."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":59,"data-source-end-line":59},"children":[{"type":"text","value":"Define artifact, graph, event, state, and snapshot schemas with versioning and provenance. Implement a pure playback reducer plus periodic snapshots. Validate replay against captured checkpoints and outputs. An interrupted/budget-limited trace has an explicit terminal status and remains inspectable; it must not look like successful completion."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":61,"data-source-end-line":61},"children":[{"type":"text","value":"Exit gate: a plain source/disassembly/state inspector can step and rewind through a branch, loop, nested call, and error with reproducible state. The graph agrees with observed control flow, including continuation targets."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-3---prove-placement-and-routing","data-source-start-line":63,"data-source-end-line":63},"children":[{"type":"text","value":"Milestone 3 - Prove placement and routing"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":65,"data-source-end-line":65},"children":[{"type":"text","value":"Run the layout bake-off in a simple top-down view using fixed footprints and ports. Establish valid paths before converting them into belts, pipes, or elevated connections."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":67,"data-source-end-line":67},"children":[{"type":"text","value":"Implement Graphviz placement and a Graphviz-only routing baseline. Add a libavoid adapter and test browser WASM integration. Run the fixtures and metrics in "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/layout#first-routing-experiment","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"layout#Block placement and connection routing#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"First routing experiment"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"2 references"},"children":[{"type":"text","value":"2"}]}]},{"type":"text","value":", first with synthetic graphs and then with extracted program CFGs."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":69,"data-source-end-line":69},"children":[{"type":"text","value":"Try Freerouting on one difficult fixed-placement fixture as a bounded experiment. Keep its output behind the same route contract; do not turn a desktop/server circuit adapter into a required browser dependency unless it clearly justifies that deployment change. Compare valid geometry and readability as well as length."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":71,"data-source-end-line":71},"children":[{"type":"text","value":"Add clearance validation, loop perimeter lanes, collision-aware grid placement, and an explicit crossing policy. Prefer widening corridors or repositioning blocks; add checked bridges only where needed. Cache layout by graph, component dimensions, and algorithm version. Compute positions once before revealing the construction sequence."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":73,"data-source-end-line":73},"children":[{"type":"text","value":"Exit gate: fixture layouts have valid ports, no component penetration, no ambiguous shared segments, and no unmarked crossings. Same inputs produce stable results, and execution events never trigger a full relayout. Select the routing engine based on measured output, not the initial preference."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-4---complete-one-schematic-user-journey","data-source-start-line":75,"data-source-end-line":75},"children":[{"type":"text","value":"Milestone 4 - Complete one schematic user journey"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":77,"data-source-end-line":77},"children":[{"type":"text","value":"Integrate editable Python, capture, graph extraction, routing, and replay before investing in detailed art. This establishes the complete product path with inexpensive visual debugging."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":79,"data-source-end-line":79},"children":[{"type":"text","value":"Run the accumulator example from the editor, reveal its source-linked program structures, and animate a control cursor through actual recorded block transitions. Show selected locals, operand stack, references, stdout, and errors in readable panels. Add run status, limits, reset, and replay controls."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":81,"data-source-end-line":81},"children":[{"type":"text","value":"Use the other supported programs to validate dynamic graph generation, not just the default fixture. An edit produces a fresh run and layout; returning to an earlier playback position does not rerun side effects. Construction is a staged explanation over actual artifacts, not a claim to display compiler wall-clock timing."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":83,"data-source-end-line":83},"children":[{"type":"text","value":"Exit gate: a user can change a condition or loop count and see the resulting graph/state/output without a hardcoded animation script. Unsupported code and resource limits produce actionable messages rather than broken scenes."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-5---render-the-xray-in-3d","data-source-start-line":85,"data-source-end-line":85},"children":[{"type":"text","value":"Milestone 5 - Render the xray in 3D"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":87,"data-source-end-line":87},"children":[{"type":"text","value":"Replace the schematic drawing with the planned xray world while retaining the same geometry and playback state. Rendering must not introduce another model of Python execution."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":89,"data-source-end-line":89},"children":[{"type":"text","value":"Create a compact original kit: ground tiles, compiler/runtime machinery, code-object enclosures, basic-block structures, instruction strips, local slots, stacks, object displays, route segments, corners, and bridges. Use distinct forms for structures with distinct meanings. Keep detailed source/disassembly text screen-aligned and legible."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":91,"data-source-end-line":91},"children":[{"type":"text","value":"Stage the build reveal, animate cursor/reference transfers along existing paths, light active machinery, and update component displays. Interpolate visual transitions without changing event order or skipping observable state changes during stepping. Loops reuse geometry; repeated calls add bounded activation displays rather than function copies."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":93,"data-source-end-line":93},"children":[{"type":"text","value":"Implement camera presets, selected-component focus, semantic detail levels, and inspector pinning. Check route occlusion and label overlap in the default view. Pause/step and reduced-motion presentation must still communicate changes without relying on travelling pulses alone."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":95,"data-source-end-line":95},"children":[{"type":"text","value":"Exit gate: the default cold run, warmed interpreter run, changed branch, and failure scenario remain understandable at presentation size. Every highlight and moving item has an identifiable event or clearly labeled explanatory purpose."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"milestone-6---validate-and-package-v1","data-source-start-line":97,"data-source-end-line":97},"children":[{"type":"text","value":"Milestone 6 - Validate and package v1"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":99,"data-source-end-line":99},"children":[{"type":"text","value":"Finish v1 with reproducible builds, bounded execution, representative examples, and targeted correctness/visual checks. Deployment is a separate final action after the build is reviewable."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":101,"data-source-end-line":101},"children":[{"type":"text","value":"Use semantic fixtures for arithmetic, aliases, loops, branches, function nesting, return, syntax error, runtime error, and budget termination. Compare output/errors to the pinned native CPython and validate capture/replay invariants. Add geometry checks for route clearance, endpoints, crossings, and deterministic layout. These test observable contracts rather than mirroring implementation details."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":103,"data-source-end-line":103},"children":[{"type":"text","value":"Exercise the actual browser build, worker reset after a timeout, repeated edits/runs, main-thread responsiveness, and visual inspection at expected viewport sizes. Record initial load, capture latency, trace size, and layout cost on representative devices; tune limits and packaging from evidence. Test the hosting configuration required by the selected WASM/worker build."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":105,"data-source-end-line":105},"children":[{"type":"text","value":"Deliver a runnable app, setup/build instructions, tracked instrumentation and fixtures, exact version/provenance metadata, and an explicit supported-program list. Update Lat to distinguish implemented behavior from remaining plans and run lat check. No JIT UI or unfinished JIT controls belong in this release."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"work-order-and-scope-decisions","data-source-start-line":107,"data-source-end-line":107},"children":[{"type":"text","value":"Work order and scope decisions"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":109,"data-source-end-line":109},"children":[{"type":"text","value":"Runtime feasibility comes first; graphs and playback follow. Routing can use synthetic fixtures while capture develops, and final 3D work begins only after an integrated schematic works."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":111,"data-source-end-line":111},"children":[{"type":"text","value":"The practical order is milestones 1 and 2, milestone 3, milestone 4, then milestones 5 and 6. Begin the routing comparison early if capture work encounters long build cycles, but keep its adapter independent. No schedule estimate is committed before the capture and routing feasibility gates."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":113,"data-source-end-line":113},"children":[{"type":"text","value":"Keep these decisions evidence-driven: whether the pinned development revision builds cleanly for the browser; which hook strategy safely exposes stacks without distorting specialization; whether libavoid's WASM integration and routing quality meet requirements; and what execution limits keep capture responsive. Any revision change, server dependency, or reduced observable scope should be made explicit rather than hidden inside an implementation shortcut."}]}]},"title":"First-version implementation plan","gitTree":null,"tableOfContents":[{"id":"first-version-implementation-plan","title":"First-version implementation plan","depth":1,"errorCount":0,"hasGitChanges":false},{"id":"user-visible-completion-target","title":"User-visible completion target","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"architecture-and-durable-artifacts","title":"Architecture and durable artifacts","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"milestone-1---prove-runtime-capture-and-wasm","title":"Milestone 1 - Prove runtime capture and WASM","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"milestone-2---extract-graphs-and-define-replay","title":"Milestone 2 - Extract graphs and define replay","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"milestone-3---prove-placement-and-routing","title":"Milestone 3 - Prove placement and routing","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"milestone-4---complete-one-schematic-user-journey","title":"Milestone 4 - Complete one schematic user journey","depth":2,"errorCount":0,"hasGitChanges":false},{"id":"milestone-5---render-the-xray-in-3d","title":"Milesto erties":{"className":["wiki-link-ref-count"],"ariaLabel":"6 references"},"children":[{"type":"text","value":"6"}]}]},{"type":"text","value":". The first "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/scene"},"children":[{"type":"text","value":"scene"},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"5 references"},"children":[{"type":"text","value":"5"}]}]},{"type":"text","value":" shares this graph; compiler-intermediate views and clearance-aware routing remain planned."}]}]},"url":"/lat.md/program-graph#program-graph-and-schematic"}]},{"sectionId":"lat.md/v1-plan#First-version implementation plan#Milestone 3 - Prove placement and routing","headingId":"milestone-3---prove-placement-and-routing","references":[]},{"sectionId":"lat.md/v1-plan#First-version implementation plan#Milestone 4 - Complete one schematic user journey","headingId":"milestone-4---complete-one-schematic-user-journey","references":[]},{"sectionId":"lat.md/v1-plan#First-version implementation plan#Milestone 5 - Render the xray in 3D","headingId":"milestone-5---render-the-xray-in-3d","references":[]},{"sectionId":"lat.md/v1-plan#First-version implementation plan#Milestone 6 - Validate and package v1","headingId":"milestone-6---validate-and-package-v1","references":[]},{"sectionId":"lat.md/v1-plan#First-version implementation plan#Work order and scope decisions","headingId":"work-order-and-scope-decisions","references":[]}],"frontmatter":{"requireCodeMention":false}}}}</script>

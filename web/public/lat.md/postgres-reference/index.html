06721aff0e2.json","view":"data/source-views/addf6ea673c43f54fb50.json"},"[\"tools/build_wasm.py\",\"build\",\"\",0,0]":{"file":"data/source-files/b7365923208ed5cc7483.json","view":"data/source-views/9a40e7643bca8324ab6a.json"},"[\"tools/capture.py\",\"run\",\"\",0,0]":{"file":"data/source-files/e7f114242d3dfe3a04bf.json","view":"data/source-views/a9a9d90223fe53f9e6bc.json"},"[\"tools/instrument_parser.py\",\"instrument\",\"\",0,0]":{"file":"data/source-files/b9e50b88cbbe350a51a6.json","view":"data/source-views/6a7b816fa4f2a2757f3f.json"},"[\"tools/package_web.py\",\"package\",\"\",0,0]":{"file":"data/source-files/b80f4e156095e4e966d2.json","view":"data/source-views/b5ee1e46f02d7462ba30.json"}},"externals":{}},"responses":{"/api/document?path=postgres-reference.md":{"path":"postgres-reference.md","tree":{"version":1,"type":"root","children":[{"type":"element","tagName":"h1","properties":{"id":"postgresql-visual-reference","data-source-start-line":1,"data-source-end-line":1},"children":[{"type":"text","value":"PostgreSQL visual reference"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":3,"data-source-end-line":3},"children":[{"type":"text","value":"The user supplied a screenshot of an ISO-GLOW PostgreSQL internals visualization. This study records visible design choices and their proposed application to CPython; its implementation and animation behavior have not been inspected."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":5,"data-source-end-line":5},"children":[{"type":"text","value":"The reference is the conversation image supplied on October 19, 2026, titled “POSTGRESQL INTERNALS,” with an executor inspector open. It shows one rendered state, not evidence of timing, simulation fidelity, or the behavior of each control. The recommendations below extend "},{"type":"element","tagName":"a","properties":{"href":"/lat.md/presentation#presentation-approach","className":["wiki-link-segmented"]},"children":[{"type":"element","tagName":"span","properties":{"className":["wiki-link-context"]},"children":[{"type":"text","value":"presentation#"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-leaf"]},"children":[{"type":"text","value":"Presentation approach"}]},{"type":"element","tagName":"span","properties":{"className":["wiki-link-ref-count"],"ariaLabel":"3 references"},"children":[{"type":"text","value":"3"}]}]},{"type":"text","value":"."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"a-persistent-system-map","data-source-start-line":7,"data-source-end-line":7},"children":[{"type":"text","value":"A persistent system map"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":9,"data-source-end-line":9},"children":[{"type":"text","value":"The screenshot presents a complete system on one physical-looking base, with functional neighborhoods and connectors. The spatial layout gives the viewer a stable place to look for each kind of activity."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":11,"data-source-end-line":11},"children":[{"type":"text","value":"Clients sit on the left, with the postmaster and backend blocks nearby. A large shared-memory board dominates the center: buffer slots, WAL buffers, transaction status, locks, and the process array are visible within it. Background processes occupy a row behind it. Data storage and a standby sit to the right; WAL segments and related processes run across the foreground. Parser, rewriter, planner, and executor form a numbered foreground row."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":13,"data-source-end-line":13},"children":[{"type":"text","value":"This combines two explanatory structures: the topology of a system and a sequence of processing stages. The proposed lesson for CPython is to keep an architectural overview available while highlighting a particular operation's route through it. A guided sequence can change focus without replacing the entire scene at every step."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":15,"data-source-end-line":15},"children":[{"type":"text","value":"The physical metaphor does not establish that every box is an independent process. In particular, numbered pipeline stages need explicit grouping. For CPython, label compiler stages as operations and frames/code objects as data structures; avoid implying that a parser, evaluator, and JIT are separate servers exchanging messages."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"state-appears-on-the-components","data-source-start-line":17,"data-source-end-line":17},"children":[{"type":"text","value":"State appears on the components"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":19,"data-source-end-line":19},"children":[{"type":"text","value":"The objects carry compact labels and state displays instead of relying entirely on a distant legend. Repeated small cells make capacity, occupancy, and individual entries visually inspectable."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":21,"data-source-end-line":21},"children":[{"type":"text","value":"Visible examples include shared-buffer slots, transaction-status dots, heap-page cells, WAL segments, backend status, and standby replay information. The single purple accent marks selected or active-looking details against subdued geometry; the screenshot alone does not reveal the precise meaning of every colored item."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":23,"data-source-end-line":23},"children":[{"type":"text","value":"For CPython, use local slots and operand-stack entries within a frame, an instruction strip and cache cells within a code object, and guarded micro-op groups within a trace. Keep values and short state labels attached to their owner. Reserve the inspector for expanded explanations, exact instructions, and source evidence."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":25,"data-source-end-line":25},"children":[{"type":"text","value":"The objects should express their representation: a stack should visibly have a top, a graph should branch, and a trace should be a sequence. Repeating server-shaped boxes for every concept would lose these distinctions. Fixed grids should not imply fixed-size Python heaps or universal implementation limits; label displayed capacity as a cropped sample when appropriate."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"actions-lead-the-exploration","data-source-start-line":27,"data-source-end-line":27},"children":[{"type":"text","value":"Actions lead the exploration"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":29,"data-source-end-line":29},"children":[{"type":"text","value":"The right panel offers named workloads and system events with keyboard shortcuts. The visible choices give viewers questions to ask of the model rather than only camera controls."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":31,"data-source-end-line":31},"children":[{"type":"text","value":"The screenshot offers SELECT, UPDATE, INSERT, a sequential-scan report, rollback, checkpoint, vacuum, a background-writer round, and crash/recovery. Demo, revolve, isometric view, palette, and theme controls support presentation and inspection. The bottom hint invites hovering over parts; the executor explanation is visible in the lower-left panel."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":33,"data-source-end-line":33},"children":[{"type":"text","value":"For CPython, propose a compact scenario panel: “Run once,” “Repeat integer loop,” “Change operand type,” “Take another branch,” and later “Change a dependency.” The interpreter/JIT selector changes the execution mode for those scenarios. Keep “Compile” available as a guided chapter, and give each scenario an explicit starting state and reset/replay action."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":35,"data-source-end-line":35},"children":[{"type":"text","value":"Warmup, specialization, trace compilation, and fallback should emerge as consequences of the selected workload. Do not make the viewer manually press a button for every internal subsystem in order to get a valid run. Expose pause and step controls for explaining those consequences once they occur."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"three-levels-of-explanation","data-source-start-line":37,"data-source-end-line":37},"children":[{"type":"text","value":"Three levels of explanation"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":39,"data-source-end-line":39},"children":[{"type":"text","value":"The screenshot combines an overview, labels and state on individual objects, and a larger component inspector. A bottom status strip summarizes the current run independently of the inspected component."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":41,"data-source-end-line":41},"children":[{"type":"text","value":"The visible inspector explains the executor in prose and includes a short waiting state. The status strip shows idle state, buffer occupancy, dirty count, hits, misses, and a log position. This separates “what this component does” from “what the system is doing now.”"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":43,"data-source-end-line":43},"children":[{"type":"text","value":"Use the same distinction for CPython. The inspector should identify the selected component, explain its role, show its current state, and link to the relevant source. A compact run strip can show execution mode, phase, source location, call depth, and executor/exit information when relevant. Keep detailed statistics in the inspector rather than filling the footer with implementation counters."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":45,"data-source-end-line":45},"children":[{"type":"text","value":"Hover should preview a description; click or keyboard focus should pin it. Essential explanations must remain accessible without hover. Selection and execution activity need distinguishable outlines or markers, even when both use the same accent hue."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"h2","properties":{"id":"proposed-cpython-arrangement","data-source-start-line":47,"data-source-end-line":47},"children":[{"type":"text","value":"Proposed CPython arrangement"}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":49,"data-source-end-line":49},"children":[{"type":"text","value":"Use the screenshot's stable neighborhoods and local state displays, with CPython-specific shapes and ownership boundaries. This is a layout proposal, not a claim about implemented geometry or physical memory placement."}]},{"type":"text","value":"\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"type":"element","tagName":"table","properties":{},"children":[{"type":"element","tagName":"thead","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":51,"data-source-end-line":51},"children":[{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Neighborhood"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Proposed contents"}]},{"type":"element","tagName":"th","properties":{},"children":[{"type":"text","value":"Relationship to the rest"}]}]}]},{"type":"element","tagName":"tbody","properties":{},"children":[{"type":"element","tagName":"tr","properties":{"data-source-start-line":53,"data-source-end-line":53},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Source and compilation edge"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Source, tokens, AST, scopes, CFG, assembly"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Produces code objects; expands for the compilation chapter"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":54,"data-source-end-line":54},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Code-object shelf"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Instructions, constants, metadata, inline caches, executor entries"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Referenced by frames; reused across calls"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":55,"data-source-end-line":55},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Central execution area"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Current frame, other activations, locals, operand stack, instruction cursor"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Main focus during stepping"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":56,"data-source-end-line":56},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Object and environment area"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Values, types, globals, selected object identities"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Connected to frame slots by reference links"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":57,"data-source-end-line":57},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"JIT extension"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Recorder, raw trace, optimizer, optimized trace, installed executor"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Revealed in JIT mode; entry and return connect to the same execution area"}]}]},{"type":"element","tagName":"tr","properties":{"data-source-start-line":58,"data-source-end-line":58},"children":[{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Build-time inset"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Stencil preparation and stencil library"}]},{"type":"element","tagName":"td","properties":{},"children":[{"type":"text","value":"Feeds native emission; stays separate from the running program"}]}]}]}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":60,"data-source-end-line":60},"children":[{"type":"text","value":"In interpreter mode, keep the JIT extension collapsed or clearly marked disabled. Enabling its view should preserve the position of the execution area and shared artifacts. Prefer this single-map mode switch as the default; side-by-side comparison remains an optional advanced view."}]},{"type":"text","value":"\n"},{"type":"element","tagName":"p","properties":{"data-source-start-line":62

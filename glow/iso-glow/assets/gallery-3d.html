<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iso 3D</title>
<style>
  :root { --bg:#121314; --panel:rgba(22,23,24,.85); --line:#26292b; --ink:#c9d0db; --dim:#7d8796; --accent:#ff9d3c; }
:root { color-scheme:dark; }
  :root[data-theme="light"] { color-scheme:light; --bg:#e9eaea; --panel:rgba(246,246,245,.9); --line:#d6d8d8; --ink:#2b2e30; --dim:#6b7075; }
  * { box-sizing:border-box; }
  @media (max-width:900px) { .build { display:none; } }
  .tops { display:flex; gap:8px; align-items:center; min-width:0; max-width:100%; }
  #theme { all:unset; cursor:pointer; width:28px; height:28px; display:grid; place-items:center; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--ink); font-size:14px; }
  #theme:hover, #spin:hover { border-color:var(--dim); }
  .seg[hidden], .seg button[hidden] { display:none !important; }
  .swatches { display:flex; align-items:center; gap:2px; padding:2px; border:1px solid var(--line); border-radius:999px; background:var(--panel); pointer-events:auto; }
  .swatches button { all:unset; pointer-events:auto; cursor:pointer; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; }
  .swatches button i { width:10px; height:10px; border-radius:50%; background:var(--sw); transition:transform .2s; }
  .swatches button:hover i { transform:scale(1.18); }
  .swatches button[aria-checked="true"] { box-shadow:0 0 0 1px var(--sw) inset; }
  #spin { all:unset; cursor:pointer; height:28px; padding:0 11px 0 9px; display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--dim); font-size:14px; }
  #spin span { font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  #spin[aria-pressed=true] { color:var(--accent); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .seg { display:flex; min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:3px; gap:2px; border:1px solid var(--line); border-radius:999px; background:var(--panel); }
  .seg button { all:unset; flex:none; white-space:nowrap; cursor:pointer; padding:5px 12px; border-radius:999px; color:var(--dim); font-size:11px; letter-spacing:.06em; }
  .seg button:hover { color:var(--ink); }
  .seg button[aria-selected=true] { color:var(--ink); background:var(--bg); box-shadow:0 0 0 1px var(--accent) inset; }
  .ctl.hide { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  .ui { position:fixed; pointer-events:none; }
  .ui > *, a.ui { pointer-events:auto; }
  #top { top:16px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .brand { flex:none; letter-spacing:.14em; text-transform:uppercase; font-size:11px; display:flex; align-items:center; gap:8px; }
  .brand i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .sw { display:flex; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:999px; background:var(--panel); }
  .sw button { width:16px; height:16px; border-radius:50%; border:1px solid rgba(255,255,255,.25); cursor:pointer; padding:0; }
  .sw button[aria-pressed=true] { outline:2px solid var(--ink); outline-offset:2px; }
  #ctl { top:64px; right:16px; display:flex; flex-direction:column; gap:6px; width:182px; max-height:calc(100vh - 140px); overflow:auto; }
  .ctl button { all:unset; pointer-events:auto; cursor:pointer;   /* all:unset would otherwise inherit pointer-events:none from .ui */
    padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); display:flex; justify-content:space-between; color:var(--dim); }
  .ctl button:hover { color:var(--ink); }
  .ctl button.on { color:var(--ink); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .ctl button kbd { font:inherit; opacity:.7; }
  .ctl .sep { height:6px; flex:none; }
  .rng { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--dim); }
  .rng input { width:100%; accent-color:var(--accent); margin:0; }
  .rng output { color:var(--ink); }
  #info { left:16px; bottom:62px; max-width:min(400px, calc(100vw - 32px)); padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  #info h2 { margin:0 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  #info p { margin:0; }
  #hint { left:16px; bottom:34px; color:var(--dim); }
  #attr { left:16px; bottom:14px; right:220px; color:var(--dim); font-size:10px; }
  #attr a { color:var(--dim); }
  #read { right:16px; bottom:14px; text-align:right; }
  #credit { right:16px; bottom:34px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); text-decoration:none; }
  #load { left:50%; top:50%; transform:translate(-50%,-50%); color:var(--dim); letter-spacing:.12em; text-transform:uppercase; }
  @media (max-width:1100px) { #hint { display:none; } #info { bottom:56px; } #credit { bottom:auto; top:44px; right:16px; } #ctl { top:72px; } }
  @media (max-width:640px) { #ctl { top:auto; bottom:170px; width:150px; max-height:40vh; } #info { bottom:92px; max-width:calc(100vw - 190px); } #credit, #hint { display:none; } }
</style>

  <button data-cs="demo">Demo<kbd>▶</kbd></button>
  <button data-cs="play">Play / stop<kbd>space</kbd></button>

<div class="ui" id="info"><h2>Click any part</h2><p>Drag to orbit, scroll to zoom, right-drag to pan. ↑ ↓ climb and descend once the rotor is at speed.</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Source model units are cm, Z-up, nose toward −y, starboard toward −x (after mirroring).
// Three.js: X = x, Y = z, Z = −y (metres).
const V = (x, y, z) => new THREE.Vector3(x / 100, z / 100, -y / 100);
const themeHooks = [];       // per-figure theme updates
let active = 'heli';           // which figure is on screen
let camAnim = null;            // iso-view snap animation

// ── renderer, scene, camera ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121314);
const persp = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 400);
// true isometric: an orthographic camera (parallel edges stay parallel, like the iso figures); Iso view toggles it
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
let orthoH = 10;                                   // frustum height (m) at zoom 1
let camera = persp;
const TARGET = new THREE.Vector3(0, 2.0, 0.5), ISO = new THREE.Vector3(-1, 1, 1).normalize();
const fitDist = () => 40 * Math.max(1, 1.45 / persp.aspect);
camera.position.copy(TARGET).addScaledVector(ISO, fitDist());
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 4; controls.maxDistance = 120;

const hemi = new THREE.HemisphereLight(0xdde4ff, 0x080808, 0.7); scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0); scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(6, 14, 10); scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.2); fill.position.set(-10, 4, -8); scene.add(fill);

// screen-space soft gradients + dither, so glows and light pools stay smooth instead of banded or blocky
const NOISE = `float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }`;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { samples: 4, type: THREE.HalfFloatType }));
const renderPass = new RenderPass(scene, camera); composer.addPass(renderPass);
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; ${NOISE}
    void main() { vec4 c = texture2D(tDiffuse, vUv); c.rgb += (hash(gl_FragCoord.xy) - 0.5) / 255.0; gl_FragColor = c; }`,
}));
composer.setSize(innerWidth, innerHeight);   // render targets at device resolution (a custom target starts at CSS size → blurry on Retina)

// ── palette & materials ──
const PALETTE = [['Sodium', '#ff9d3c'], ['Tungsten', '#ffd27a'], ['Neon', '#ff4fa3'], ['Signal', '#3ee08f'], ['Dusk', '#7b8cff'], ['Moon', '#cfe3ff']];
const accent = new THREE.Color(PALETTE[0][1]);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: 0.9, metalness: 0.05, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const bladeMat = new THREE.MeshStandardMaterial({ color: 0x1d1e21, roughness: 0.8, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const padMat = new THREE.MeshBasicMaterial({ color: 0x18191b });          // unlit, so cabin lights don't leak through the hull onto the deck
// tinted see-through glass: the lit cockpit and cabin show through it, it doesn't glow by itself
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide, emissive: accent.clone(), emissiveIntensity: 0 });
const devRes = () => renderer.getDrawingBufferSize(new THREE.Vector2());
// two tiers like the iso figures: silhouette outline (--line) and crease/detail edges (--detail); always 1 CSS px
// three tiers, as in the iso figures: silhouette (--line) > major folds > minor detail (--detail, barely above the face fill)
const LINE_COL = new THREE.Color(0x4f5357), MAJOR_COL = new THREE.Color(0x393c3f), EDGE_COL = new THREE.Color(0x27292c), BG_COL = new THREE.Color(0x121314);
const MAJOR_ANGLE = 60;
// lines are pulled slightly toward the camera so the surface they sit on never hides parts of them
const lineOpts = { linewidth: 1, resolution: devRes(), polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -6 };
const lineMat = new LineMaterial({ color: EDGE_COL, ...lineOpts });
const majorMat = new LineMaterial({ color: MAJOR_COL, ...lineOpts });
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: LINE_COL.clone() }, thickness: { value: 1 }, res: { value: devRes() } },
  vertexShader: `uniform float thickness; uniform vec2 res;
    void main() {
      vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      vec4 n = projectionMatrix * vec4(normalize(normalMatrix * normal), 0.0);
      vec2 d = length(n.xy) > 1e-5 ? normalize(n.xy) : vec2(0.0);
      p.xy += d * thickness * 2.0 / res * p.w;
      gl_Position = p;
    }`,
  fragmentShader: `uniform vec3 color; void main() { gl_FragColor = vec4(color, 1.0); }`,
  side: THREE.BackSide,
  // push the silhouette shell behind the hull: seen from inside the cabin it would otherwise sit exactly on the inner walls and z-fight
  polygonOffset: true, polygonOffsetFactor: 6, polygonOffsetUnits: 24,
});
const accentMats = [];
const glowMat = (base = 0x1a1d22) => { const m = new THREE.MeshStandardMaterial({ color: base, emissive: accent.clone(), emissiveIntensity: 0, roughness: 0.35 }); accentMats.push(m); return m; };
const navMat = glowMat(), beaconMat = glowMat(), padLightMat = glowMat();
// lamp halos: one screen-facing point per lamp, shaded per pixel (no full-screen bloom, so no blocky upsampled halos)
const glowMats = [];
function glowPoints(positions, size) {
  const g = new THREE.BufferGeometry().setFromPoints(positions);
  const m = new THREE.ShaderMaterial({
    uniforms: { color: { value: accent.clone() }, intensity: { value: 0 }, size: { value: size }, scale: { value: 1 }, light: { value: 0 }, ortho: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    // the sprite is pulled half its size toward the camera so the deck it sits on can't clip its lower half
    vertexShader: `uniform float size, scale, ortho;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = ortho > 0.5 ? size * scale : size * scale / -mv.z;
        mv.xyz -= normalize(mv.xyz) * size * 0.5;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform vec3 color; uniform float intensity, light; ${NOISE}
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
        float halo = exp(-d * d * 9.0) * (1.0 - d);
        float core = 1.0 - smoothstep(0.05, 0.12, d);
        float a = (halo * 0.7 + core * 0.9) * intensity + (hash(gl_FragCoord.xy) - 0.5) / 255.0;
        vec3 c = mix(color, vec3(1.0), core * 0.6 * (1.0 - light));
        // dark theme adds light; light theme lays the halo over the pale deck as a tint
        gl_FragColor = light > 0.5 ? vec4(c, clamp(a, 0.0, 1.0)) : vec4(c * max(a, 0.0), 1.0);
      }`,
  });
  if (theme === 'light') { m.blending = THREE.NormalBlending; m.uniforms.light.value = 1; }   // lamps created after a theme switch
  glowMats.push(m);
  return new THREE.Points(g, m);
}
// soft radial pool (light on the deck, or the aircraft's shadow), computed per pixel and dithered
const softGlows = [];   // additive halos / light pools / haze: shown in the dark theme only
const softMat = (color, additive) => { const m = softMat0(color, additive); if (additive) { softGlows.push(m); } return m; };
function softMat0(color, additive) { return new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(color) }, opacity: { value: 0 } },
  transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, toneMapped: false,
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 color; uniform float opacity; varying vec2 vUv; ${NOISE}
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float a = smoothstep(1.0, 0.0, d); a *= a;
      a = a * opacity + (hash(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(color, max(a, 0.0));
    }`,
}); }
const spotMat = softMat(0xffffff, true), spillMat = softMat(0xffffff, true), shadowMat = softMat(0x000000, false);
const cabinLight = new THREE.PointLight(0xffffff, 0, 2.3, 2), cockpitLight = new THREE.PointLight(0xffffff, 0, 1.9, 2);
// ── themes (same tokens as the iso figures' light and dark themes) ──
const THEMES = {
  dark:  { bg: 0x121314, body: 0x1b1c1f, blade: 0x1d1e21, pad: 0x18191b, lamp: 0x1a1d22, line: 0x4f5357, major: 0x393c3f, edge: 0x27292c,
           sky: 0xdde4ff, ground: 0x080808, hemi: 0.7, amb: 0, sun: 0.7, fill: 0.2, shadow: 0.7, fadeMin: 0.45 },
  light: { bg: 0xe9eaea, body: 0xf1f1f0, blade: 0xececeb, pad: 0xf6f6f5, lamp: 0xd8dadb, line: 0x5d6266, major: 0x8a8f93, edge: 0xb9bcbf,
           sky: 0xffffff, ground: 0xe6e6e6, hemi: 0.9, amb: 1.6, sun: 0.35, fill: 0.15, shadow: 0.16, fadeMin: 0.8 },
};
let theme = 'dark', accentHex = PALETTE[0][1];
function setAccent(hex) {
  accentHex = hex;
  accent.set(hex);
  accentMats.forEach(m => m.emissive.copy(accent));
  glassMat.emissive.copy(accent);
  glowMats.forEach(m => m.uniforms.color.value.copy(accent));
  [spotMat, spillMat].forEach(m => m.uniforms.color.value.copy(accent));
  cabinLight.color.copy(accent); cockpitLight.color.copy(accent);
  document.documentElement.style.setProperty('--accent', '#' + accent.getHexString());
}

// ── line helpers ──
const fatLines = [];
const fat = (arr, mat = lineMat) => { const l = new LineSegments2(new LineSegmentsGeometry().setPositions(arr), mat); fatLines.push(l); return l; };
const loopL = (pts, mat = majorMat) => { const out = []; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; out.push(a.x, a.y, a.z, b.x, b.y, b.z); } return fat(out, mat); };
function glassPane(ps) {
  const v = ps.map(p => V(...p)), g = new THREE.BufferGeometry().setFromPoints([v[0], v[1], v[2], v[0], v[2], v[3]]);
  g.computeVertexNormals(); const m = new THREE.Mesh(g, glassMat); m.renderOrder = 2; return m;
}
function addOutline(m) { const o = new THREE.Mesh(m.geometry, outlineMat); o.userData.outline = true; m.add(o); }

// ── part catalogue (names match nodes in the embedded parts file) ──
const INFO = {
  fuselage: ['Airframe & cabin', 'Aluminium and composite semi-monocoque airframe. The SH-60B flies with a crew of three: pilot, airborne tactical officer and sensor operator, who works from the cabin.'],
  mainRotor: ['Main rotor', 'Four composite blades on titanium spars, 16.4 m diameter, on an elastomeric-bearing hub that needs no lubrication. Turns counter-clockwise seen from above at about 258 rpm; on the Seahawk the blades fold aft for ship stowage.'],
  tailRotor: ['Tail rotor', 'Four-blade bearingless tail rotor, 3.4 m diameter, on the starboard side of the pylon. Canted about 20° on the real aircraft so it adds a little lift as well as anti-torque thrust.'],

const ACCENTS3 = [['Ember', '#ff9d3c'], ['Cyan', '#22d3ee'], ['Lime', '#a3e635'], ['Violet', '#a78bfa'], ['Rose', '#fb7185'], ['Ice', '#dfe9ef']];
const swEl = document.getElementById('swatches');

function pickAccent(k) {
  const a = ACCENTS3.find(x => x[0].toLowerCase() === k) || ACCENTS3[0]; k = a[0].toLowerCase();

}

{ let k = null; try { k = localStorage.getItem('iso-accent'); } catch (e) {} pickAccent(k || 'ember'); }
